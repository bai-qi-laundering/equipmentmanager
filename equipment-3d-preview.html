document.getElementById('zin').onclick=()=>{cam.radius-=18;setCam()};document.getElementById('zout').onclick=()=>{cam.radius+=18;setCam()};
document.getElementById('toggle').onclick=e=>{hideLabels=!hideLabels;e.target.textContent=hideLabels?'顯示標籤':'隱藏標籤'};
document.getElementById('close').onclick=()=>{detail.classList.remove('open');selected=null};
document.getElementById('official').onclick=()=>location.href='./index.html';
document.getElementById('filter').onchange=e=>{for(const n of nodes.values())n.group.visible=e.target.value==='all'||n.item.cat===e.target.value};
document.getElementById('upload').onchange=async e=>{const file=e.target.files[0];if(!file||!selected)return;if(file.size>8*1024*1024){notify('圖片請小於 8 MB');return}const id=selected;try{const img=await loadImage(URL.createObjectURL(file));const c=document.createElement('canvas');c.width=512;c.height=512;const x=c.getContext('2d');const scale=Math.min(500/img.width,500/img.height);x.drawImage(img,(512-img.width*scale)/2,(512-img.height*scale)/2,img.width*scale,img.height*scale);const data=c.toDataURL('image/png');updateTexture(id,canvasTexture(c));await storeImage(id,data);notify('已替換 '+nodes.get(id).item.name+'，圖片只存在此瀏覽器');}catch(err){notify('圖片儲存失敗：'+err.message)}finally{e.target.value=''}};
document.getElementById('restore').onclick=async()=>{if(!selected)return;const id=selected;const item=nodes.get(id).item;const img=await loadImage('factory-map-clean-v13.svg');updateTexture(id,id==='DRYCLEAN-01'?await textureFromUrl('assets/dryclean-front.svg'):croppedTexture(img,item));await deleteImage(id);notify('已恢復原始設備圖像')};
}
function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);for(const [id,n]of nodes){const el=labels.get(id);if(hideLabels||!n.group.visible){el.style.display='none';continue}v3.copy(n.spr.position).add(n.group.position).project(camera);if(v3.z>1||Math.abs(v3.x)>1.15||Math.abs(v3.y)>1.15){el.style.display='none';continue}el.style.display='block';el.style.left=((v3.x+1)*innerWidth/2)+'px';el.style.top=((1-v3.y)*innerHeight/2-12)+'px';}}
function loadImage(url){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>{if(url.startsWith('blob:'))URL.revokeObjectURL(url);resolve(i)};i.onerror=()=>reject(Error('無法載入圖檔'));i.src=url})}
async function textureFromUrl(url){const img=await loadImage(url);const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');const sc=Math.min(245/img.width,245/img.height);x.drawImage(img,(256-img.width*sc)/2,(256-img.height*sc)/2,img.width*sc,img.height*sc);return canvasTexture(c)}
const DB_NAME='baiqi-3d-preview-images',STORE='equipment';
function db(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function storeImage(id,data){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(data,id);t.oncomplete=()=>{d.close();res()};t.onerror=()=>{d.close();rej(t.error)}})}
async function deleteImage(id){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=()=>{d.close();res()};t.onerror=()=>{d.close();rej(t.error)}})}
async function restoreSavedImages(){try{const d=await db();const t=d.transaction(STORE,'readonly');const os=t.objectStore(STORE);const keys=await new Promise((r,j)=>{const q=os.getAllKeys();q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});for(const key of keys){const data=await new Promise((r,j)=>{const q=os.get(key);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});if(nodes.has(key)&&data){const img=await loadImage(data);const c=document.createElement('canvas');c.width=512;c.height=512;c.getContext('2d').drawImage(img,0,0,512,512);updateTexture(key,canvasTexture(c))}}d.close()}catch(e){notify('設備圖片可使用，但此瀏覽器無法永久儲存：'+e.message)}}
(async()=>{if(!window.THREE){document.getElementById('loading').textContent='3D 引擎載入失敗，請檢查網路';return}let img=null;try{img=await loadImage('factory-map-clean-v13.svg')}catch(e){notify('原圖載入失敗，使用備用設備圖像')}build(img);if(nodes.has('DRYCLEAN-01'))try{updateTexture('DRYCLEAN-01',await textureFromUrl('assets/dryclean-front.svg'))}catch(e){}})();
</script></body></html>
