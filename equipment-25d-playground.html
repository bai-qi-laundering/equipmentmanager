<header><div class="brand"><div class="brandmark">BQ</div><div><div class="eyebrow">FACTORY MAP · PLAYGROUND</div><h1>設備地圖試玩室</h1></div></div><span class="demo">獨立示範 · 不改正式資料</span></header>
<div class="intro"><small>固定視角 / 2.5D</small><h2>讓機器，成為入口。</h2><p>拖曳移動 · 雙指縮放 · 點一台設備試試</p></div>
<nav class="focus-nav" aria-label="快速查看"><button data-focus="DRY-02">↗ 看烘乾機上下層</button><button data-focus="VERT-01">洗衣機</button><button data-focus="OFFICE-01">辦公室</button></nav>
<nav class="toolbar" aria-label="圖層"><button class="pill" id="upper" aria-pressed="true">架高設備：顯示</button><button class="pill" id="labels" aria-pressed="true">設備名稱</button><button class="pill" id="badges" aria-pressed="true">工作狀態</button></nav>
<main id="viewport" aria-label="可拖曳縮放的設備示範地圖"><div id="world">
<svg class="floor" viewBox="0 0 1420 970" aria-hidden="true"><defs><pattern id="grid" width="80" height="40" patternUnits="userSpaceOnUse"><path d="M0 20 40 0 80 20 40 40Z" fill="none" stroke="#cbd7c6" stroke-width=".65"/></pattern><radialGradient id="fade"><stop offset="0" stop-color="white"/><stop offset=".95" stop-color="black"/></radialGradient><mask id="floorMask"><rect width="1420" height="970" fill="url(#fade)"/></mask></defs><rect width="1420" height="970" fill="url(#grid)" mask="url(#floorMask)"/></svg>
<div class="area" style="left:1070px;top:775px">洗衣區<small>WASHING</small></div><div class="area" style="left:520px;top:775px">烘乾區<small>DRYING</small></div><div class="area" style="left:940px;top:70px">辦公區<small>OFFICE</small></div>
<img class="upper-art" id="upperArt" src="assets/manganese-front.png" alt="" draggable="false"><button class="upper-target" id="manganese" data-id="MANG-01" aria-label="錳砂過濾設備，位於烘乾機 5 號上方"><span class="nameplate">錳砂過濾設備<small>架高 · 位於烘乾機 5 號上方</small></span><span class="badge"></span></button><div class="link-note">↑ 錳砂架設於烘乾機 5 號上方</div>
</div></main>
<div class="camera" aria-label="縮放操作"><button id="minus" aria-label="縮小">−</button><span class="zoom-number" id="zoomNumber">100%</span><button id="plus" aria-label="放大">＋</button><button id="home">全區</button></div>
<aside class="drawer" id="drawer" hidden aria-label="設備示範操作"><div class="drawer-top"><div><small id="eqCategory"></small><h2 id="eqTitle"></h2></div><button class="close" id="close" aria-label="關閉設備資訊">×</button></div><div class="subline" id="eqLocation"></div><div class="status-select" aria-label="切換模擬狀態"><button data-state="normal">正常</button><button data-state="due">待查檢</button><button data-state="issue">異常</button></div><div class="tabs" role="tablist"><button data-tab="info" role="tab">資料</button><button data-tab="check" role="tab">查檢</button><button data-tab="repair" role="tab">維修</button></div><div class="content" id="content"></div><p class="note">這裡都是示範操作。狀態與紀錄僅在本次試玩中保留。</p></aside>
<footer class="bottom"><div class="legend"><span><i class="dot"></i>正常</span><span><i class="dot due"></i>待查檢</span><span><i class="dot issue"></i>異常</span></div><span class="desktop-hint">設備位置固定 · 滾輪縮放 · 方向鍵移動</span><span id="summary">示範區域</span></footer><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),world=$('world'),viewport=$('viewport');
const machines=[
{id:'OFFICE-01',name:'辦公室',category:'辦公區',x:1120,y:290,w:265,h:250,atlas:[505,750,250,274],state:'normal',detail:'辦公室外觀試看；沿用既有兩層辦公室圖像。'},
{id:'VERT-01',name:'洗衣機 #8',category:'洗衣設備',x:1190,y:455,w:175,h:186,atlas:[302,12,223,245],state:'normal'},
{id:'VERT-02',name:'洗衣機 #7',category:'洗衣設備',x:1190,y:665,w:175,h:186,atlas:[302,12,223,245],state:'issue'},
{id:'VERT-07',name:'洗衣機 #2',category:'洗衣設備',x:1190,y:870,w:175,h:186,atlas:[302,12,223,245],state:'normal'},
{id:'DRY-03',name:'烘乾機 #3',category:'烘乾設備',x:470,y:650,w:190,h:158,src:'assets/dryer-front.png',state:'normal'},
{id:'DRY-02',name:'烘乾機 #5',category:'烘乾設備',x:800,y:650,w:190,h:158,src:'assets/dryer-front.png',state:'due',detail:'錳砂設備架設在這台烘乾機上方。兩台設備可各自點選、查看紀錄。'},
{id:'MANG-01',name:'錳砂過濾設備',category:'水處理設備',x:800,y:475,w:500,h:180,upper:true,state:'normal',detail:'架設於烘乾機 5 號上方，屬於架高設備，並非整層二樓。'}
];
const byId=new Map(machines.map(m=>[m.id,m]));
const statusNames={normal:'正常',due:'待查檢',issue:'異常待處理'};
const demoTasks=m=>m.upper?['確認管線與接頭無滲漏','檢查壓力與運轉狀況','清理外觀並確認平台狀況']:m.id==='OFFICE-01'?['確認辦公區環境','確認照明與電器電源','完成環境整理']:['確認機台外觀及周邊環境','檢查異常聲音與運轉狀態','清潔並完成檢查'];
let selected=null,tab='info',upper=true,labels=true,badges=true,toastTimer,fit=1;
const view={x:0,y:0,scale:1};
const objectUrls=new Set();
for(const m of machines){m.tasks=demoTasks(m).map(text=>({text,done:false}));m.repairs=[];if(m.upper)continue;const el=document.createElement('button');el.className='unit';el.dataset.id=m.id;el.setAttribute('aria-label',m.name);el.style.cssText=`left:${m.x}px;top:${m.y}px;width:${m.w}px;height:${m.h}px;z-index:${m.id==='DRY-02'?9:Math.round(m.y/100)}`;
if(m.atlas){const [x,y,w,h]=m.atlas;el.innerHTML=`<svg class="art" viewBox="${x} ${y} ${w} ${h}" aria-hidden="true" focusable="false"><image href="assets/equipment-atlas-v6.png" width="1536" height="1024"/></svg>`;}else{const img=document.createElement('img');img.className='art';img.src=m.src;img.alt='';img.draggable=false;el.append(img);}
const name=document.createElement('span');name.className='nameplate';name.append(document.createTextNode(m.name));const sub=document.createElement('small');sub.textContent=m.id;name.append(sub);const badge=document.createElement('span');badge.className='badge';el.append(name,badge);m.originalArt=el.querySelector('.art').cloneNode(true);world.append(el);}
function renderBadges(){for(const m of machines){const el=world.querySelector(`[data-id="${m.id}"]`),badge=el.querySelector('.badge');badge.textContent=m.state==='normal'?'':statusNames[m.state];badge.classList.toggle('issue',m.state==='issue');el.classList.toggle('selected',selected===m.id);el.setAttribute('aria-label',m.name+'，'+statusNames[m.state]);}const due=machines.filter(m=>m.state==='due').length,issues=machines.filter(m=>m.state==='issue').length;$('summary').textContent=`${machines.length} 台示範 · ${due} 台待查檢 · ${issues} 台異常`;}
function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.scale})`;$('zoomNumber').textContent=Math.round(view.scale/fit*100)+'%';}
function frame(){const r=viewport.getBoundingClientRect();fit=Math.min((r.width-50)/1000,(r.height-190)/880);fit=Math.max(.13,Math.min(1.05,fit));view.scale=fit;view.x=(r.width-1000*fit)/2-420*fit;view.y=Math.max(innerWidth<=700?158:100,(r.height-850*fit)/2+30);applyView();}
function zoom(factor,point){const r=viewport.getBoundingClientRect(),p=point||{x:r.width/2,y:r.height/2},x=(p.x-view.x)/view.scale,y=(p.y-view.y)/view.scale;view.scale=Math.max(fit*.55,Math.min(3.5,view.scale*factor));view.x=p.x-x*view.scale;view.y=p.y-y*view.scale;applyView();}
function showUpper(value){upper=value;world.classList.toggle('upper-off',!upper);$('upper').setAttribute('aria-pressed',String(upper));$('upper').textContent='架高設備：'+(upper?'顯示':'隱藏');if(!upper&&selected==='MANG-01')closePanel();}
function focusMachine(id){const m=byId.get(id);if(!m)return;if(m.upper||id==='DRY-02')showUpper(true);const r=viewport.getBoundingClientRect(),mobile=innerWidth<=700;view.scale=Math.min(1.35,Math.max(fit*1.8,r.width/(id==='DRY-02'?620:570)));view.x=r.width*(mobile?.5:.44)-m.x*view.scale;view.y=r.height*(mobile?.32:.63)-(m.y-(id==='DRY-02'?145:70))*view.scale;applyView();select(id);}
function select(id){const m=byId.get(id);if(!m)return;selected=id;tab='info';$('drawer').hidden=false;document.body.classList.add('panel-open');renderPanel();renderBadges();}
function closePanel(){selected=null;$('drawer').hidden=true;document.body.classList.remove('panel-open');renderBadges();}
function notify(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2400);}
function renderPanel(){const m=byId.get(selected);if(!m)return;$('eqTitle').textContent=m.name;$('eqCategory').textContent=m.category+' / '+m.id;$('eqLocation').textContent=m.upper?'架高設備 · 烘乾機 5 號上方':'地面設備 · 示範區域';document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('active',b.dataset.state===m.state));document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-selected',String(b.dataset.tab===tab));});const content=$('content');content.replaceChildren();
if(tab==='info'){const dl=document.createElement('dl');for(const [label,value] of [['設備狀態',statusNames[m.state]],['空間位置',m.upper?'架高設備':'地面設備'],['示範查檢',m.tasks.filter(t=>t.done).length+' / '+m.tasks.length+' 項'],['維修紀錄',m.repairs.length+' 筆']]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;dl.append(dt,dd);}content.append(dl);if(m.detail){const p=document.createElement('p');p.textContent=m.detail;content.append(p);}const action=document.createElement('button');action.className='action';action.textContent='試填查檢清單';action.onclick=()=>{tab='check';renderPanel();};content.append(action);const label=document.createElement('label');label.className='upload';label.textContent='＋ 試用自己的去背圖片';const input=document.createElement('input');input.type='file';input.accept='image/png,image/webp,image/jpeg';input.onchange=()=>useImage(m,input);label.append(input);content.append(label);if(m.custom){const restore=document.createElement('button');restore.className='action secondary';restore.textContent='恢復原本圖像';restore.onclick=()=>{if(m.upper)$('upperArt').src='assets/manganese-front.png';else world.querySelector(`[data-id="${m.id}"] .art`).replaceWith(m.originalArt.cloneNode(true));if(m.customUrl){URL.revokeObjectURL(m.customUrl);objectUrls.delete(m.customUrl);}m.custom=false;m.customUrl=null;renderPanel();notify('這台設備已恢復原本圖像');};content.append(restore);}}
if(tab==='check'){const intro=document.createElement('p');intro.textContent='勾選後可試按完成，觀察地圖狀態變化。';content.append(intro);m.tasks.forEach((t,i)=>{const row=document.createElement('label');row.className='task';const input=document.createElement('input');input.type='checkbox';input.checked=t.done;input.onchange=()=>{t.done=input.checked;};const text=document.createElement('span');text.textContent=t.text;row.append(input,text);content.append(row);});const button=document.createElement('button');button.className='action';button.textContent='完成本次示範查檢';button.onclick=()=>{if(!m.tasks.every(t=>t.done))return notify('先把本次示範項目都勾選，再試著完成');m.state='normal';renderPanel();renderBadges();notify('示範查檢已完成，地圖標記已更新');};content.append(button);}
if(tab==='repair'){if(!m.repairs.length){const p=document.createElement('p');p.textContent='尚無本次試玩的維修紀錄。';content.append(p);}for(const r of m.repairs){const item=document.createElement('div');item.className='repair';const title=document.createElement('b');title.textContent=r.time;const p=document.createElement('p');p.textContent=r.text;item.append(title,p);content.append(item);}const button=document.createElement('button');button.className='action';button.textContent='＋ 新增一筆示範維修';button.onclick=()=>{m.repairs.unshift({time:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}),text:'已檢查並完成機台處理（示範紀錄）'});m.state='normal';renderPanel();renderBadges();notify('已加入示範維修紀錄');};content.append(button);}}
async function useImage(m,input){const file=input.files[0];if(!file)return;if(file.size>8*1024*1024)return notify('圖片請小於 8 MB');const url=URL.createObjectURL(file),img=new Image();try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});if(m.customUrl){URL.revokeObjectURL(m.customUrl);objectUrls.delete(m.customUrl);}m.customUrl=url;objectUrls.add(url);if(m.upper){$('upperArt').src=url;}else{const el=world.querySelector(`[data-id="${m.id}"]`);img.className='art';img.alt='';img.draggable=false;el.querySelector('.art').replaceWith(img);}m.custom=true;renderPanel();notify('已試用這張圖片，重新開啟頁面會恢復');}catch{URL.revokeObjectURL(url);notify('這張圖片無法讀取，請改用 PNG、WebP 或 JPG');}}
$('upper').onclick=()=>showUpper(!upper);$('labels').onclick=()=>{labels=!labels;world.classList.toggle('labels-off',!labels);$('labels').setAttribute('aria-pressed',String(labels));};$('badges').onclick=()=>{badges=!badges;world.classList.toggle('badges-off',!badges);$('badges').setAttribute('aria-pressed',String(badges));};$('plus').onclick=()=>zoom(1.25);$('minus').onclick=()=>zoom(.8);$('home').onclick=()=>{closePanel();frame();};$('close').onclick=closePanel;document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>focusMachine(b.dataset.focus));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderPanel();});document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{const m=byId.get(selected);if(!m)return;m.state=b.dataset.state;renderPanel();renderBadges();notify('已切換為示範狀態：'+statusNames[m.state]);});
// Pointer events unify iPhone pinch, tablet pan and desktop dragging. A pinch never becomes a tap.
const pointers=new Map();let tap=null,previous=null,multi=false;
function metric(){const a=[...pointers.values()];if(!a.length)return null;if(a.length===1)return{x:a[0].x,y:a[0].y,d:0};return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};}
viewport.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();const r=viewport.getBoundingClientRect();pointers.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});viewport.setPointerCapture(e.pointerId);if(pointers.size===1){multi=false;tap={id:e.pointerId,x:e.clientX,y:e.clientY,target:e.target.closest('[data-id]')?.dataset.id,moved:false};}else{multi=true;tap=null;}previous=metric();});
viewport.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();const r=viewport.getBoundingClientRect();pointers.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});const current=metric();if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>8)tap.moved=true;if(previous&&current){if(current.d&&previous.d){zoom(current.d/Math.max(previous.d,1),{x:previous.x,y:previous.y});}view.x+=current.x-previous.x;view.y+=current.y-previous.y;applyView();}previous=current;if(tap?.moved||multi)viewport.classList.add('dragging');});
function end(e,cancel=false){if(!pointers.has(e.pointerId))return;const target=tap&&tap.id===e.pointerId&&!tap.moved&&!multi&&!cancel?tap.target:null;pointers.delete(e.pointerId);tap=null;previous=metric();if(!pointers.size){multi=false;viewport.classList.remove('dragging');}if(target)select(target);}
viewport.addEventListener('pointerup',e=>end(e));viewport.addEventListener('pointercancel',e=>end(e,true));viewport.addEventListener('lostpointercapture',e=>end(e,true));viewport.addEventListener('wheel',e=>{e.preventDefault();const r=viewport.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),{x:e.clientX-r.left,y:e.clientY-r.top});},{passive:false});
world.addEventListener('click',e=>{if(e.detail!==0)return;const id=e.target.closest('[data-id]')?.dataset.id;if(id)select(id);});document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='Escape')return closePanel();const moves={ArrowLeft:[35,0],ArrowRight:[-35,0],ArrowUp:[0,35],ArrowDown:[0,-35]};if(moves[e.key]){e.preventDefault();view.x+=moves[e.key][0];view.y+=moves[e.key][1];applyView();}});let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(frame,150);});addEventListener('pagehide',()=>{for(const url of objectUrls)URL.revokeObjectURL(url);});renderBadges();frame();
</script></body></html>
