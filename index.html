const layoutFields=['name','status','cleaningLastDate','cleaningCycleDays','maintenanceLastDate','maintenanceCycleDays','commissionedDate','notes'];
const dirtyMetadataIds=new Set(JSON.parse(localStorage.getItem('factoryFixedPendingIds')||'[]'));
let layoutBaseline=null,hasUnsyncedLayoutChanges=false,savePromise=null,syncRequested=false;
function normalizeNasRow(v){
 const date=k=>v[k]?String(v[k]).slice(0,10):'';
 return {id:String(v.id).trim(),name:v.name||'',type:v.type||'',kind:v.kind||'',x:Number(v.x),z:Number(v.z),rotationY:Number(v.rotation_y??v.rotationY??0),status:v.status||'正常',
 cleaningLastDate:date('cleaning_last_date'),cleaningCycleDays:Number(v.cleaning_cycle_days??30),
 maintenanceLastDate:date('maintenance_last_date'),maintenanceCycleDays:Number(v.maintenance_cycle_days??180),
 commissionedDate:date('commissioned_date'),notes:v.notes||'',version:v.version};
}
function mergeLayoutChanges(local,baseline,remote){
 const writes=[],expectedVersions={},merged=new Map(remote.map(v=>[String(v.id),{...v}]));
 for(const row of local){
  const id=String(row.id),base=baseline.get(id),latest=merged.get(id);
  const changed=layoutFields.filter(k=>!base||row[k]!==base[k]);
  if(!changed.length)continue;
  if(base&&!latest)throw new Error('設備 '+id+' 已從 NAS 移除，請先確認資料');
  const next=latest?{...latest}:{...row};
  for(const k of changed){
   if(base&&latest[k]!==base[k]&&latest[k]!==row[k])throw new Error('設備 '+id+' 的 '+k+' 已被另一台裝置修改；尚未覆蓋 NAS');
   next[k]=row[k];
  }
  if(latest&&layoutFields.every(k=>next[k]===latest[k]))continue;
  writes.push(next);expectedVersions[id]=latest?.version??null;merged.set(id,next);
 }
 return {writes,expectedVersions,merged};
}
function reconcileNasRows(merged,snapshot){
 const before=new Map(snapshot.map(v=>[String(v.id),v]));
 const current=new Map(getPositionData().map(v=>[String(v.id),v]));
 groups.forEach(r=>{
  const id=String(r.userData.id),next=merged.get(id),prev=before.get(id),live=current.get(id);
  if(!next||!prev||!live)return;
  for(const k of layoutFields){
   if(live[k]!==prev[k])continue;
   if(k==='name')applyEquipmentName(r,next[k]);
   else if(k==='x'||k==='z')r.position[k]=next[k];
   else if(k==='rotationY')r.rotation.y=next[k];
   else r.userData[k]=next[k];
  }
  syncEquipmentSprite(r);
 });
}
async function fetchNasLayout(){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
 try{
  const res=await fetch(API_BASE+'/api/layout?t='+Date.now(),{cache:'no-store',signal:controller.signal});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const payload=await res.json();
  if(!Array.isArray(payload.positions))throw new Error('NAS 回傳格式錯誤');
  return payload;
 }finally{clearTimeout(timer);}
}

function applyMetadata(root,row){
 const normalized=Object.hasOwn(row,'rotation_y')||Object.hasOwn(row,'cleaning_last_date')?normalizeNasRow(row):row;
 for(const k of layoutFields){if(!Object.hasOwn(normalized,k))continue;if(k==='name'){
  // Preserve custom names, but migrate former autogenerated numbering to the approved plan.
  if(/^直式洗衣機\s*#0[123]$|^烘乾機\s*#0[123]$|^錳砂過濾設備$|^L型桌$|^打包機$/.test(normalized.name||''))continue;
  applyEquipmentName(root,normalized.name);
 }else root.userData[k]=normalized[k];}
}
async function loadRemoteLayout(){
 if(syncing)return false;
 nasReadState.status='正在讀取 NAS';nasReadState.ok=false;setSyncBadge(nasReadState.status);renderNasReadDetails();
 try{const payload=await fetchNasLayout();const positions=payload.positions.filter(v=>v&&v.id!=null);
 nasReadState.positions=positions;const byId=new Map(positions.map(v=>[String(v.id).trim(),v]));
 groups.forEach(r=>{const v=byId.get(r.userData.id);if(v&&!dirtyMetadataIds.has(r.userData.id))applyMetadata(r,v);});
 const baseline=new Map(getPositionData().map(v=>[String(v.id),{...v}]));
 // Baseline keeps raw NAS metadata, so intentional numbering migrations are visible on save.
 for(const row of positions)baseline.set(String(row.id),normalizeNasRow(row));layoutBaseline=baseline;
 try{localStorage.setItem(SYNC_KEY,JSON.stringify(getPositionData()));}catch(err){}
 apiAvailable=true;nasReadState.ok=true;nasReadState.at=new Date().toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei'});
 nasReadState.status='已讀取 NAS，共 '+positions.length+' 筆設備資料';setSyncBadge(nasReadState.status,true);renderNasReadDetails();renderCategoryList();requestSceneRender();return true;
 }catch(err){apiAvailable=false;nasReadState.status=err.name==='AbortError'?'NAS 讀取逾時；地圖仍可操作':'NAS 讀取失敗：'+err.message;setSyncBadge(nasReadState.status);renderNasReadDetails();return false;}
}
function saveRemoteLayout(){
 if(savePromise){syncRequested=true;return savePromise;}
 savePromise=Promise.resolve().then(async()=>{
  syncing=true;let success=false;
  try{
   if(!layoutBaseline)throw new Error('尚未取得 NAS 基準資料；請先讀取 NAS 再編輯');
   do{
    syncRequested=false;
    const snapshot=getPositionData().filter(r=>dirtyMetadataIds.has(r.id));
    const payload=await fetchNasLayout();
    if(payload.syncVersion!==2)throw new Error('NAS 服務需更新到同步 R3；尚未送出資料');
    const {writes,expectedVersions,merged}=mergeLayoutChanges(snapshot,layoutBaseline,payload.positions.map(normalizeNasRow));
    if(writes.length){
     const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
     let result;
     try{
      const res=await fetch(API_BASE+'/api/layout',{method:'PUT',headers:{'Content-Type':'application/json'},signal:controller.signal,body:JSON.stringify({syncVersion:2,positions:writes,expectedVersions})});
      if(res.status===409)throw new Error('另一台裝置剛更新資料；尚未覆蓋 NAS，請確認後再儲存');
      if(res.status===428)throw new Error('NAS 要求新版同步程式，請重新開啟網頁');
      if(!res.ok)throw new Error('儲存失敗 HTTP '+res.status);
      result=await res.json();
     }finally{clearTimeout(timer);}
     for(const row of writes)merged.get(String(row.id)).version=result.versions?.[String(row.id)];
    }
    reconcileNasRows(merged,snapshot);
    layoutBaseline=new Map([...merged].map(([id,row])=>[id,{...row}]));
    nasReadState.positions=[...merged.values()];nasReadState.ok=true;
    nasReadState.at=new Date().toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei'});
    // Diagnostics accept normalized rows, which retain the stable equipment ID/name.
    hasUnsyncedLayoutChanges=getPositionData().filter(row=>dirtyMetadataIds.has(row.id)).some(row=>layoutFields.some(k=>row[k]!==layoutBaseline.get(String(row.id))?.[k]));
    try{localStorage.setItem(SYNC_KEY,JSON.stringify(getPositionData()));}catch(err){}
    apiAvailable=true;nasReadState.status='NAS 已同步';setSyncBadge(nasReadState.status,true);renderNasReadDetails();requestSceneRender();
   }while(syncRequested);
   if(!hasUnsyncedLayoutChanges){dirtyMetadataIds.clear();localStorage.removeItem('factoryFixedPendingIds');}success=true;return true;

function frameFactory(overview=false){

  let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
  groups.forEach(r=>{
    minX=Math.min(minX,r.position.x);
    maxX=Math.max(maxX,r.position.x);
    minZ=Math.min(minZ,r.position.z);
    maxZ=Math.max(maxZ,r.position.z);
  });
  const cx=(minX+maxX)/2;
  const cz=(minZ+maxZ)/2;
  const spanX=Math.max(1,maxX-minX);
  const spanZ=Math.max(1,maxZ-minZ);
  const aspect=innerWidth/innerHeight;
  const portrait=aspect<0.82;
  const bounds=new THREE.Box3();groups.forEach(r=>bounds.expandByObject(r));
  const size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());
  const availableW=(innerWidth-24)/innerWidth,availableH=Math.max(.3,(innerHeight-(innerWidth<1025?104:84)-164)/innerHeight);
  const fit=Math.max((size.x+12)/(2*aspect*availableW),(size.z*.725+size.y*.69+12)/(2*availableH))*1.04;
  const base=100;
  camera.left=-base*aspect;
  camera.right=base*aspect;
  camera.top=base;
  camera.bottom=-base;
  camera.near=-1000;
  camera.far=2000;
  camera.zoom=base/fit;
  camera.setViewOffset(innerWidth,innerHeight,0,(164-(innerWidth<1025?104:84))/2,innerWidth,innerHeight);
  const dir=new THREE.Vector3(0,1.05,1).normalize();
  camera.position.copy(new THREE.Vector3(center.x,center.y,center.z).addScaledVector(dir,260));
  controls.target.copy(center);

const INSPECTION_KEY='factory-inspection-v1';
const PERIODS={weekly:'每週',monthly:'每月',quarterly:'每季',halfyear:'每半年',yearly:'每年'};
const escapeInspection=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function taipeiToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function validDay(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v||''))return false;let d=new Date(v+'T00:00:00Z');return Number.isFinite(+d)&&d.toISOString().slice(0,10)===v;}
function addDays(v,n){let d=new Date(v+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function addMonths(v,n){let d=new Date(v+'T00:00:00Z'),day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);let max=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,max));return d.toISOString().slice(0,10);}
function weekOnOrAfter(v,weekday){let d=new Date(v+'T00:00:00Z');return addDays(v,(weekday-d.getUTCDay()+7)%7);}
function firstTuesday(v){let first=v.slice(0,8)+'01',result=weekOnOrAfter(first,2);return result>=v?result:weekOnOrAfter(addMonths(first,1),2);}
function advanceTask(t,anchor){if(t.period==='weekly')return t.weekday?weekOnOrAfter(addDays(anchor,1),t.weekday):addDays(anchor,7);if(t.firstTuesday)return firstTuesday(addMonths(anchor.slice(0,8)+'01',1));return addMonths(anchor,{monthly:1,quarterly:3,halfyear:6,yearly:12}[t.period]);}

function equipmentServiceAge(start,today=taipeiToday()){
 if(!validDay(start))return '尚未設定啟用日期';
 if(start>today)return '啟用日期不能晚於今天';
 let months=(Number(today.slice(0,4))-Number(start.slice(0,4)))*12+Number(today.slice(5,7))-Number(start.slice(5,7));
 if(addMonths(start,months)>today)months--;
 const anchor=addMonths(start,months),days=Math.round((Date.parse(today+'T00:00:00Z')-Date.parse(anchor+'T00:00:00Z'))/86400000);
 return '已使用 '+Math.floor(months/12)+' 年 '+months%12+' 個月 '+days+' 天';
}
function refreshEquipmentDates(){
 document.getElementById('eqServiceAge').textContent=equipmentServiceAge(document.getElementById('eqCommissionedDate').value);
 const date=document.getElementById('eqCleaningDate').value,days=Number(document.getElementById('eqCleaningCycle').value);
 const next=validDay(date)&&days>0?addDays(date,days):'';
 document.getElementById('eqNextCleaning').textContent=next?'下次機台清潔：'+next+(next<taipeiToday()?'（已逾期）':''):'請設定上次清潔日期與清潔週期';
}
['eqCommissionedDate','eqCleaningDate','eqCleaningCycle'].forEach(id=>document.getElementById(id).addEventListener('input',refreshEquipmentDates));

function newInspectionState(){return {version:1,baseline:taipeiToday(),profile:'',records:[],drafts:{},settings:{},reminder:{time:'08:00',lead:1}};}
function validateInspectionState(s){
 if(!s||s.version!==1||!validDay(s.baseline)||!Array.isArray(s.records)||!s.settings||Array.isArray(s.settings)||!s.drafts||Array.isArray(s.drafts)||typeof s.profile!=='string'||!s.reminder||!/^\d{2}:\d{2}$/.test(s.reminder.time)||s.reminder.time>'23:59'||s.reminder.time.slice(3)>'59'||![0,1,3].includes(Number(s.reminder.lead)))throw Error('檔案格式不正確');
 for(const r of s.records){if(!r||typeof r.id!=='string'||typeof r.machineId!=='string'||!validDay(r.date)||r.date>taipeiToday()||typeof r.operator!=='string'||!r.operator.trim()||!Array.isArray(r.items)||!r.items.length||!Number.isFinite(Date.parse(r.createdAt)))throw Error('紀錄格式不正確');for(const i of r.items){if(i.due&&!validDay(i.due))throw Error('品項日期不正確');if(typeof i.taskId!=='string'||typeof i.item!=='string'||!['normal','abnormal','na'].includes(i.result)||((i.result==='abnormal'||i.result==='na')&&!String(i.note||'').trim()))throw Error('查檢品項格式不正確');}}
 for(const d of Object.values(s.drafts)){if(!d||typeof d!=='object'||!d.answers||typeof d.answers!=='object')throw Error('草稿格式不正確');}
 for(const cfg of Object.values(s.settings)){if(!cfg||typeof cfg!=='object'||!cfg.dues||typeof cfg.dues!=='object')throw Error('排程格式不正確');for(const [p,d] of Object.entries(cfg.dues))if(!(p in PERIODS)||(d&&!validDay(d)))throw Error('排程日期不正確');if(cfg.customCleaningDue&&!validDay(cfg.customCleaningDue))throw Error('首次清潔日期不正確');if(cfg.customCleaningDays!==undefined&&(!Number.isInteger(cfg.customCleaningDays)||cfg.customCleaningDays<1||cfg.customCleaningDays>3660))throw Error('清潔週期不正確');}
 return s;
}
let inspectionState=newInspectionState(),inspectionLoadError=false;

function persistInspection(next){if(inspectionLoadError){toast('原資料無法讀取，請先在設定匯出原始備份，避免覆蓋');return false;}try{localStorage.setItem(INSPECTION_KEY,JSON.stringify(next));inspectionState=next;return true;}catch(e){toast('儲存失敗：空間不足或瀏覽器限制，請先匯出備份');return false;}}
function editInspection(fn){const next=JSON.parse(JSON.stringify(inspectionState));fn(next);return persistInspection(next);}
function machineCategory(m){const n=m.name.replace(/\s/g,'').toUpperCase(),id=m.id||'',k=m.kind||'';
 if(/^60K(?:-|$)/.test(id)||n==='60K'||n==='TB-60K')return 'TB-60K';if(/^80K(?:-|$)/.test(id)||n==='80K'||n==='TB-80K')return 'TB-80K';if(/^30K(?:-|$)/.test(id)||n==='30K')return '';
 if(/^W(?:35|50)-|^VERT-/.test(id)||/洗衣/.test(m.name))return '洗衣機';if(/^DRY-/.test(id)||/烘乾/.test(m.name))return '烘乾機';if(/^CRANE-/.test(id)||/天車/.test(m.name))return '天車';
 if(k==='longPress'||/壓板機|平燙機/.test(m.name))return '壓板機';if(id==='MANG-01'||/錳砂|猛沙/.test(m.name))return '錳砂';
 const stable={'N5-01':'N5','IRT-01':'IRT','SHIRT-01':'襯衫機','FINISH-01':'整燙區','ICC-01':'ICC','SMF-01':'SMF','COMP-01':'空壓機','BOILER-01':'鍋爐','WATER-01':'水設備','TANK-01':'水塔','DRYCLEAN-01':'乾洗機'};
 if(stable[id])return stable[id];return ['N5','IRT','襯衫機','整燙區','ICC','SMF','空壓機','鍋爐','水設備','水塔','乾洗機','軟水','發電機','移載車'].find(v=>n===v)||'';
}
function inspectionMachines(){const out=[...groups.values()].map(r=>({...r.userData,onMap:true}));for(const record of inspectionState.records){if(!out.some(m=>m.id===record.machineId))out.push({id:record.machineId,name:record.machineName||record.machineId,type:'歷史設備',kind:'',onMap:false});}for(const name of ['軟水','發電機','移載車'])if(!out.some(m=>machineCategory(m)===name))out.push({id:'CHECK-'+name,name,type:'查檢設備',kind:'',onMap:false});return out;}
function machineTasks(m){let list=INSPECTION_TEMPLATES.filter(t=>t.machine===machineCategory(m));const cfg=inspectionState.settings[m.id];const days=cfg?.customCleaningDays||Number(m.cleaningCycleDays);if(days>0)list=[...list,{id:'CUSTOM-CLEAN',item:'機台清潔',machine:m.name,period:'custom',cleaning:true,days}];return list;}
function taskDue(m,t){const done=inspectionState.records.filter(r=>r.machineId===m.id&&r.items.some(i=>i.taskId===t.id)).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt)).at(-1);
 if(done){const item=done.items.find(i=>i.taskId===t.id),anchor=t.cleaning?done.date:[done.date,item.due||''].sort().at(-1);return t.period==='custom'?addDays(anchor,t.days):advanceTask(t,anchor);}
 const cfg=inspectionState.settings[m.id];if(t.period==='custom')return validDay(m.cleaningLastDate)?addDays(m.cleaningLastDate,t.days):cfg?.customCleaningDue||'';
 if(cfg?.dues[t.period])return cfg.dues[t.period];if(t.weekday)return weekOnOrAfter(inspectionState.baseline,t.weekday);if(t.firstTuesday)return firstTuesday(inspectionState.baseline);return '';
}
function pendingIssues(m){return inspectionState.records.filter(r=>r.machineId===m.id).flatMap(r=>r.items.filter(i=>i.result==='abnormal'&&!i.resolvedAt).map(i=>({record:r,item:i})));}
function machineSummary(m){let due=machineTasks(m).map(t=>taskDue(m,t)).filter(Boolean).sort();const last=inspectionState.records.filter(r=>r.machineId===m.id).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt)).at(-1);let cleaned=inspectionState.records.filter(r=>r.machineId===m.id&&r.items.some(i=>i.cleaning&&i.result==='normal')).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt)).at(-1);const legacy=m.cleaningLastDate||'';return {due:due[0]||'',last,clean:cleaned&&cleaned.date>=legacy?(cleaned.actualAt||cleaned.date):legacy,issues:pendingIssues(m).length};}

 toast('查檢紀錄已保存於本機');inspectionPeriod='history';renderInspection();
}
function renderInspectionSettings(){inspectContent.innerHTML=`<form id="inspectionSettings" class="ins-card"><h3>現場人員與提醒偏好</h3><label>查檢人員姓名<input name="operator" autocomplete="name" value="${I(inspectionState.profile)}"></label><label>提醒時間（台灣時間）<input name="time" type="time" required value="${I(inspectionState.reminder.time)}"></label><label>提前提醒<select name="lead">${[[0,'到期當天'],[1,'提前 1 天'],[3,'提前 3 天']].map(([v,l])=>`<option value="${v}" ${Number(inspectionState.reminder.lead)===v?'selected':''}>${l}</option>`).join('')}</select></label><button class="ins-primary" type="submit">儲存偏好</button><p class="ins-muted">目前不會自動傳送手機通知。可匯出未來 90 天的行事曆；匯入行事曆後，提醒由行事曆 App 管理。排程修改後需重新匯出。跨手機共用紀錄及自動推播，需再串接 NAS 服務。</p></form><div class="ins-card"><h3>備份與行事曆</h3><div class="ins-actions">${inspectButton('匯出查檢備份','export')}${inspectButton('匯出提醒行事曆','calendar')}</div><label class="ins-file">合併匯入查檢備份<input id="inspectionImport" type="file" accept="application/json,.json"></label><p class="ins-muted">紀錄依 ID 合併；本機同 ID 紀錄優先保留。排程、姓名及提醒偏好以本機為準。提醒行事曆是一次性檔案，不會自動更新。</p></div><div class="ins-card"><h3>排程依據</h3><p class="ins-muted">依原檢查表整理 73 個不重複項目。週三／四／五依「每周」表；月排程依「每月」表第一個週二。季、半年、年度及未指定星期的項目，請在各機台設定首次到期日。30K 原表無項目；移載車、軟水、發電機保留為清單設備。初次建立日期：${I(inspectionState.baseline)}。</p></div>`;
 document.getElementById('inspectionSettings').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(editInspection(st=>{st.profile=f.get('operator').trim();st.reminder={time:f.get('time'),lead:Number(f.get('lead'))};}))toast('偏好已儲存；自動通知尚未啟用');};
 document.getElementById('inspectionImport').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>15*1024*1024)throw Error('備份超過 15MB');const incoming=validateInspectionState(JSON.parse(await f.text()));const ids=new Set(inspectionState.records.map(r=>r.id));const extra=incoming.records.filter(r=>!ids.has(r.id));if(editInspection(st=>st.records.push(...extra))){toast('已合併 '+extra.length+' 筆紀錄');renderInspection();}}catch(err){toast('匯入失敗：'+err.message);}};
}
function downloadInspection(text,name,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function calendarEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
function foldCalendarLine(line){let parts=[],part='',bytes=0;for(const c of line){let n=new TextEncoder().encode(c).length;if(bytes+n>73){parts.push(part);part=' ';bytes=1;}part+=c;bytes+=n;}parts.push(part);return parts.join('\r\n');}
function inspectionCalendar(){const today=taipeiToday(),end=addDays(today,90),time=inspectionState.reminder.time.replace(':','')+'00',lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Factory//Inspection//ZH','CALSCALE:GREGORIAN','X-WR-CALNAME:機台查檢提醒'];let count=0;
 for(const m of inspectionMachines())for(const t of machineTasks(m)){let day=taskDue(m,t);if(!day)continue;while(day<today)day=t.period==='custom'?addDays(day,t.days):advanceTask(t,day);for(let loops=0;day<=end&&loops<100;loops++){const utc=new Date(day+'T'+inspectionState.reminder.time+':00+08:00').toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const endutc=new Date(Date.parse(day+'T'+inspectionState.reminder.time+':00+08:00')+900000).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');lines.push('BEGIN:VEVENT','UID:'+calendarEscape(m.id+'-'+t.id+'-'+day)+'@factory-inspection','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART:'+utc,'DTEND:'+endutc,'SUMMARY:'+calendarEscape(m.name+'｜'+t.item),'DESCRIPTION:'+calendarEscape('請到設備地圖完成查檢。負責人：'+(inspectionState.profile||'未指定')+'。此行事曆不會自動同步。'),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:機台查檢提醒','TRIGGER:-P'+Number(inspectionState.reminder.lead)+'D','END:VALARM','END:VEVENT');count++;day=t.period==='custom'?addDays(day,t.days):advanceTask(t,day);}}
 lines.push('END:VCALENDAR');return {text:lines.map(foldCalendarLine).join('\r\n')+'\r\n',count};
}
inspectContent.addEventListener('click',e=>{const b=e.target.closest('[data-ia]');if(!b)return;const a=b.dataset.ia;
 if(a==='machine'){inspectionMachineId=b.dataset.id;inspectionView='machine';inspectionPeriod='due';renderInspection();}
 else if(a==='filter'){inspectionFilter=b.dataset.value;renderInspection();}
 else if(a==='period'||a==='history'||a==='schedule'){if(!saveInspectionDraft())return;inspectionPeriod=a==='period'?(b.dataset.value||'due'):a;renderInspection();}
 else if(a==='map'){hideInspection();select(groups.get(inspectionMachineId));}
 else if(a==='answer'){if(!saveInspectionDraft())return;if(editInspection(st=>{const d=st.drafts[inspectionMachineId];d.answers[b.dataset.task]||={};d.answers[b.dataset.task].result=b.dataset.value;})){const field=b.closest('fieldset');field.querySelectorAll('[data-ia="answer"]').forEach(el=>{let chosen=el.dataset.value===b.dataset.value;el.className=chosen?'chosen '+el.dataset.value:'';el.setAttribute('aria-pressed',String(chosen));});const note=field.querySelector('textarea');note.placeholder=b.dataset.value==='normal'?'備註（選填）':b.dataset.value==='abnormal'?'異常內容及處理情形（必填）':'不適用原因（必填）';if(b.dataset.value!=='normal')note.focus();updateInspectionProgress();}}
 else if(a==='resolve'){const name=inspectionState.profile||prompt('處理人員姓名');if(!name?.trim())return;const note=prompt('請填寫實際處理結果');if(!note?.trim())return;if(editInspection(st=>{const r=st.records.find(r=>r.id===b.dataset.record),i=r.items.find(i=>i.taskId===b.dataset.task);i.resolvedAt=new Date().toISOString();i.resolvedBy=name.trim();i.resolution=note.trim();}))renderInspection();}
 else if(a==='export')downloadInspection(inspectionLoadError?localStorage.getItem(INSPECTION_KEY):JSON.stringify(inspectionState,null,2),'查檢紀錄_'+taipeiToday()+'.json','application/json');
 else if(a==='calendar'){const cal=inspectionCalendar();if(!cal.count)return toast('尚無排程，請先設定機台到期日');downloadInspection(cal.text,'機台查檢提醒_'+taipeiToday()+'.ics','text/calendar;charset=utf-8');toast('行事曆已匯出，請在行事曆 App 匯入後確認提醒');}
});
document.getElementById('inspectionBack').onclick=()=>{if(!saveInspectionDraft())return;if(inspectionView==='list')hideInspection();else{inspectionView='list';renderInspection();}};
document.getElementById('inspectionSettingsBtn').onclick=()=>{if(!saveInspectionDraft())return;inspectionView='settings';renderInspection();};
document.getElementById('inspectionSubmit').onclick=submitInspection;
document.getElementById('inspectionEntry').onclick=()=>openInspection();
document.addEventListener('keydown',e=>{if(inspectEl.hidden)return;if(e.key==='Escape'){e.preventDefault();if(saveInspectionDraft())hideInspection();}if(e.key==='Tab'){const els=[...inspectEl.querySelectorAll('button,input,select,textarea,summary')].filter(el=>!el.disabled&&el.getClientRects().length),first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
function renderInspectionMini(root){const el=document.getElementById('inspectionMini');if(!el||typeof inspectionState==='undefined')return;const m={...root.userData,onMap:true},s=machineSummary(m);el.innerHTML=`<b>清潔與查檢</b><p>${I(equipmentServiceAge(m.commissionedDate))}<br>上次清潔：${I(s.clean||'尚無紀錄')}<br>下次查檢：${I(s.due||'待設定')}${s.issues?'<br><span class="ins-danger">'+s.issues+' 項異常待處理</span>':''}</p><button id="inspectionMachineEntry" style="width:100%;min-height:48px">開啟此機台查檢清單</button>`;document.getElementById('inspectionMachineEntry').onclick=()=>openInspection(root.userData.id);}
document.querySelectorAll('.side button').forEach((b,index)=>{if(index===1)b.onclick=()=>{activeCategory='all';renderCategoryList();document.getElementById('categoryDrawer').hidden=false;};if(index===2||index===3)b.onclick=()=>openInspection();if(index===4)b.onclick=()=>{inspectionFilter='issue';openInspection();};});
if(inspectionLoadError)toast('原查檢資料無法讀取，已暫停寫入；請在設定匯出原始備份');
</script></div>
</body></html>
