}

const layoutFields=['name','status','cleaningLastDate','cleaningCycleDays','maintenanceLastDate','maintenanceCycleDays','commissionedDate','notes'];
const dirtyMetadataIds=new Set(JSON.parse(localStorage.getItem('factoryFixedPendingIds')||'[]'));
let layoutBaseline=null,hasUnsyncedLayoutChanges=false,savePromise=null,syncRequested=false;
function normalizeNasRow(v){
 const date=k=>v[k]?String(v[k]).slice(0,10):'';
 return {id:String(v.id).trim(),name:v.name||'',type:v.type||'',kind:v.kind||'',x:Number(v.x),z:Number(v.z),rotationY:Number(v.rotation_y??v.rotationY??0),status:v.status||'正常',
 cleaningLastDate:date('cleaning_last_date'),cleaningCycleDays:Number(v.cleaning_cycle_days??30),
 maintenanceLastDate:date('maintenance_last_date'),maintenanceCycleDays:Number(v.maintenance_cycle_days??180),
 commissionedDate:date('commissioned_date'),notes:v.notes||'',version:v.version};
}
function mergeLayoutChanges(local,baseline,remote){
 const writes=[],expectedVersions={},merged=new Map(remote.map(v=>[String(v.id),{...v}]));
 for(const row of local){
  const id=String(row.id),base=baseline.get(id),latest=merged.get(id);
  const changed=layoutFields.filter(k=>!base||row[k]!==base[k]);
  if(!changed.length)continue;
  if(base&&!latest)throw new Error('設備 '+id+' 已從 NAS 移除，請先確認資料');
  const next=latest?{...latest}:{...row};
  for(const k of changed){
   if(base&&latest[k]!==base[k]&&latest[k]!==row[k])throw new Error('設備 '+id+' 的 '+k+' 已被另一台裝置修改；尚未覆蓋 NAS');
   next[k]=row[k];
  }
  if(latest&&layoutFields.every(k=>next[k]===latest[k]))continue;
  writes.push(next);expectedVersions[id]=latest?.version??null;merged.set(id,next);
 }
 return {writes,expectedVersions,merged};
}
function reconcileNasRows(merged,snapshot){
 const before=new Map(snapshot.map(v=>[String(v.id),v]));
 const current=new Map(getPositionData().map(v=>[String(v.id),v]));
 groups.forEach(r=>{
  const id=String(r.userData.id),next=merged.get(id),prev=before.get(id),live=current.get(id);
  if(!next||!prev||!live)return;
  for(const k of layoutFields){
   if(live[k]!==prev[k])continue;
   if(k==='name')applyEquipmentName(r,next[k]);
   else if(k==='x'||k==='z')r.position[k]=next[k];
   else if(k==='rotationY')r.rotation.y=next[k];
   else if(k==='notes')decodeEquipmentMetadata(r,next[k]);else r.userData[k]=next[k];
  }
  syncEquipmentSprite(r);
 });
}
async function fetchNasLayout(){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
 try{
  const res=await apiFetch(API_BASE+'/api/layout?t='+Date.now(),{cache:'no-store',signal:controller.signal});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const payload=await res.json();
  if(!Array.isArray(payload.positions))throw new Error('NAS 回傳格式錯誤');
  return payload;
 }finally{clearTimeout(timer);}
}

function applyMetadata(root,row){
 const normalized=Object.hasOwn(row,'rotation_y')||Object.hasOwn(row,'cleaning_last_date')?normalizeNasRow(row):row;
 for(const k of layoutFields){if(!Object.hasOwn(normalized,k))continue;if(k==='name'){
  // Preserve custom names, but migrate former autogenerated numbering to the approved plan.
  if(/^直式洗衣機\s*#0[123]$|^烘乾機\s*#0[123]$|^錳砂過濾設備$|^L型桌$|^打包機$/.test(normalized.name||''))continue;
  applyEquipmentName(root,normalized.name);
 }else if(k==='notes')decodeEquipmentMetadata(root,normalized[k]);else root.userData[k]=normalized[k];}
}
let layoutReading=false;
async function loadRemoteLayout(){
 if(syncing||layoutReading)return false;
 layoutReading=true;
 nasReadState.status='正在讀取 NAS';nasReadState.ok=false;setSyncBadge(nasReadState.status);renderNasReadDetails();
 try{const payload=await fetchNasLayout();const positions=payload.positions.filter(v=>v&&v.id!=null);
 nasReadState.positions=positions;const byId=new Map(positions.map(v=>[String(v.id).trim(),v]));
 groups.forEach(r=>{const v=byId.get(r.userData.id);if(v&&!dirtyMetadataIds.has(r.userData.id))applyMetadata(r,v);});
 const baseline=new Map(getPositionData().map(v=>[String(v.id),{...v}]));
 // Baseline keeps raw NAS metadata, so intentional numbering migrations are visible on save.
 for(const row of positions)baseline.set(String(row.id),normalizeNasRow(row));layoutBaseline=baseline;
 try{localStorage.setItem(SYNC_KEY,JSON.stringify(getPositionData()));}catch(err){}
 apiAvailable=true;nasReadState.ok=true;nasReadState.at=new Date().toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei'});
 nasReadState.status='已讀取 NAS，共 '+positions.length+' 筆設備資料';setSyncBadge(nasReadState.status,true);renderNasReadDetails();renderCategoryList();requestSceneRender();return true;
 }catch(err){apiAvailable=false;nasReadState.status=err.name==='AbortError'?'NAS 讀取逾時；地圖仍可操作':'NAS 讀取失敗：'+err.message;setSyncBadge(nasReadState.status);renderNasReadDetails();return false;}finally{layoutReading=false;}
}
function saveRemoteLayout(){
 if(savePromise){syncRequested=true;return savePromise;}
 savePromise=Promise.resolve().then(async()=>{
  syncing=true;let success=false;
  try{
   if(!layoutBaseline)throw new Error('尚未取得 NAS 基準資料；請先讀取 NAS 再編輯');
   do{
    syncRequested=false;
    const snapshot=getPositionData().filter(r=>dirtyMetadataIds.has(r.id));
    const payload=await fetchNasLayout();
    if(payload.syncVersion!==2)throw new Error('NAS 服務需更新到同步 R3；尚未送出資料');
    const {writes,expectedVersions,merged}=mergeLayoutChanges(snapshot,layoutBaseline,payload.positions.map(normalizeNasRow));
    if(writes.length){
     const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
     let result;
     try{
      const res=await apiFetch(API_BASE+'/api/layout',{method:'PUT',headers:{'Content-Type':'application/json'},signal:controller.signal,body:JSON.stringify({syncVersion:2,positions:writes,expectedVersions})});
      if(res.status===409)throw new Error('另一台裝置剛更新資料；尚未覆蓋 NAS，請確認後再儲存');
      if(res.status===428)throw new Error('NAS 要求新版同步程式，請重新開啟網頁');
      if(!res.ok)throw new Error('儲存失敗 HTTP '+res.status);
      result=await res.json();
     }finally{clearTimeout(timer);}
     for(const row of writes)merged.get(String(row.id)).version=result.versions?.[String(row.id)];
    }
    reconcileNasRows(merged,snapshot);
    layoutBaseline=new Map([...merged].map(([id,row])=>[id,{...row}]));
    nasReadState.positions=[...merged.values()];nasReadState.ok=true;
    nasReadState.at=new Date().toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei'});
    // Diagnostics accept normalized rows, which retain the stable equipment ID/name.
    hasUnsyncedLayoutChanges=getPositionData().filter(row=>dirtyMetadataIds.has(row.id)).some(row=>layoutFields.some(k=>row[k]!==layoutBaseline.get(String(row.id))?.[k]));
    try{localStorage.setItem(SYNC_KEY,JSON.stringify(getPositionData()));}catch(err){}
    apiAvailable=true;nasReadState.status='NAS 已同步';setSyncBadge(nasReadState.status,true);renderNasReadDetails();requestSceneRender();
   }while(syncRequested);
   if(!hasUnsyncedLayoutChanges){dirtyMetadataIds.clear();localStorage.removeItem('factoryFixedPendingIds');}success=true;return true;
  }catch(err){
   hasUnsyncedLayoutChanges=true;nasReadState.status=err.name==='AbortError'?'NAS 同步逾時，請確認後再儲存':err.message;
   setSyncBadge(nasReadState.status);renderNasReadDetails();return false;
  }finally{syncing=false;savePromise=null;if(!success)syncRequested=false;}
 });
 return savePromise;
}

const INSPECTION_KEY='factory-inspection-v1';
const PERIODS={weekly:'每週',monthly:'每月',quarterly:'每季',halfyear:'每半年',yearly:'每年'};
const escapeInspection=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function taipeiToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function validDay(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v||''))return false;let d=new Date(v+'T00:00:00Z');return Number.isFinite(+d)&&d.toISOString().slice(0,10)===v;}
function addDays(v,n){let d=new Date(v+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function addMonths(v,n){let d=new Date(v+'T00:00:00Z'),day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);let max=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,max));return d.toISOString().slice(0,10);}
function weekOnOrAfter(v,weekday){let d=new Date(v+'T00:00:00Z');return addDays(v,(weekday-d.getUTCDay()+7)%7);}
function firstTuesday(v){let first=v.slice(0,8)+'01',result=weekOnOrAfter(first,2);return result>=v?result:weekOnOrAfter(addMonths(first,1),2);}
function advanceTask(t,anchor){if(t.period==='weekly')return t.weekday?weekOnOrAfter(addDays(anchor,1),t.weekday):addDays(anchor,7);if(t.firstTuesday)return firstTuesday(addMonths(anchor.slice(0,8)+'01',1));return addMonths(anchor,{monthly:1,quarterly:3,halfyear:6,yearly:12}[t.period]);}

function equipmentServiceAge(start,today=taipeiToday()){
 if(!validDay(start))return '尚未設定啟用日期';
 if(start>today)return '啟用日期不能晚於今天';
 let months=(Number(today.slice(0,4))-Number(start.slice(0,4)))*12+Number(today.slice(5,7))-Number(start.slice(5,7));
 if(addMonths(start,months)>today)months--;
 const anchor=addMonths(start,months),days=Math.round((Date.parse(today+'T00:00:00Z')-Date.parse(anchor+'T00:00:00Z'))/86400000);
 return '已使用 '+Math.floor(months/12)+' 年 '+months%12+' 個月 '+days+' 天';
}
function refreshEquipmentDates(){
 document.getElementById('eqServiceAge').textContent=equipmentServiceAge(document.getElementById('eqCommissionedDate').value);
 const date=document.getElementById('eqCleaningDate').value,days=Number(document.getElementById('eqCleaningCycle').value);
 const next=validDay(date)&&days>0?addDays(date,days):'';
 document.getElementById('eqNextCleaning').textContent=next?'下次機台清潔：'+next+(next<taipeiToday()?'（已逾期）':''):'請設定上次清潔日期與清潔週期';
}
['eqCommissionedDate','eqCleaningDate','eqCleaningCycle'].forEach(id=>document.getElementById(id).addEventListener('input',refreshEquipmentDates));

 for(const r of s.records){if(!r||typeof r.id!=='string'||typeof r.machineId!=='string'||!validDay(r.date)||r.date>taipeiToday()||typeof r.operator!=='string'||!r.operator.trim()||!Array.isArray(r.items)||!r.items.length||!Number.isFinite(Date.parse(r.createdAt)))throw Error('紀錄格式不正確');for(const i of r.items){if(i.due&&!validDay(i.due))throw Error('品項日期不正確');if(typeof i.taskId!=='string'||typeof i.item!=='string'||!['normal','abnormal','na'].includes(i.result)||((i.result==='abnormal'||i.result==='na')&&!String(i.note||'').trim()))throw Error('查檢品項格式不正確');if(i.photos&&(!Array.isArray(i.photos)||i.photos.length>3||i.photos.some(p=>!p||typeof p.id!=='string'||!/^[-a-f0-9]{36}$/i.test(p.id))))throw Error('照片索引格式不正確');}}

function machineCategory(m){const n=m.name.replace(/\s/g,'').toUpperCase(),id=m.id||'',k=m.kind||'';
 if(/^60K(?:-|$)/.test(id)||n==='60K'||n==='TB-60K')return 'TB-60K';if(/^80K(?:-|$)/.test(id)||n==='80K'||n==='TB-80K')return 'TB-80K';if(/^30K(?:-|$)/.test(id)||n==='30K')return '';

function inspectionCanonical(v){return JSON.stringify(v,(_,x)=>x&&typeof x==="object"&&!Array.isArray(x)?Object.fromEntries(Object.keys(x).sort().map(k=>[k,x[k]])):x);}
// V14: journal and records saved together so interrupted/offline writes survive reload.
let inspectionSyncBusy=false,inspectionSyncTimer,inspectionSyncMessage='正在連接 NAS…';
const inspectionEntityKey=(kind,id)=>JSON.stringify([kind,id]);
function inspectionShared(s){const out={};for(const r of s.records)out[inspectionEntityKey('record',r.id)]=r;for(const [id,cfg] of Object.entries(s.settings))out[inspectionEntityKey('setting',id)]=cfg;out[inspectionEntityKey('meta','baseline')]={date:s.baseline};out[inspectionEntityKey('meta','reminder')]={...s.reminder,recipient:'簡通延'};return out;}
function inspectionJournal(s){return s.nasSync||={version:1,revisions:{},pending:{},conflicts:{}};}
function queueInspectionChanges(before,next){const journal=inspectionJournal(next),old=inspectionShared(before),now=inspectionShared(next);for(const [key,data] of Object.entries(now)){if(inspectionCanonical(data)!==inspectionCanonical(old[key]))journal.pending[key]={data,expectedRevision:journal.revisions[key]??null};}}
function inspectionSyncStatus(){const el=document.getElementById('inspectionSyncStatus');if(!el)return;const j=inspectionJournal(inspectionState),n=Object.keys(j.pending).length,c=Object.keys(j.conflicts).length;el.textContent=inspectionSyncMessage+(n?' · '+n+' 筆待同步':'')+(c?' · '+c+' 筆版本衝突':'');document.getElementById('inspectionConflictBtn').hidden=!c;}
function scheduleInspectionSync(){clearTimeout(inspectionSyncTimer);inspectionSyncTimer=setTimeout(syncInspectionNas,700);inspectionSyncStatus();}
function applyInspectionEntity(s,e){if(e.kind==='record'){const i=s.records.findIndex(r=>r.id===e.id);if(i<0)s.records.push(e.data);else s.records[i]=e.data;}else if(e.kind==='setting')s.settings[e.id]=e.data;else if(e.id==='baseline')s.baseline=e.data.date;else if(e.id==='reminder')s.reminder={time:e.data.time,lead:e.data.lead};}
async function inspectionRequest(method,body){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const res=await apiFetch(API_BASE+'/api/inspection-sync',{method,cache:'no-store',headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined,signal:controller.signal});if(res.status===404)throw Error('NAS 尚未更新查檢服務');const data=await res.json();if(!res.ok&&res.status!==409)throw Error('NAS 查檢服務回傳 '+res.status);return {res,data};}finally{clearTimeout(timer);}}
function saveInspectionSyncState(next){validateInspectionState(next);return persistInspection(next,true);}
async function syncInspectionNas(){
 if(inspectionSyncBusy||inspectionLoadError)return;inspectionSyncBusy=true;inspectionSyncMessage='正在同步 NAS…';inspectionSyncStatus();
 try{
  const {data}=await inspectionRequest('GET');if(data.inspectionVersion!==1||!Array.isArray(data.entities))throw Error('NAS 查檢服務版本不符');
  const next=JSON.parse(JSON.stringify(inspectionState)),j=inspectionJournal(next),shared=inspectionShared(next),remote=new Map(data.entities.map(e=>[inspectionEntityKey(e.kind,e.id),e]));
  // Import pre-V14 records once. Existing NAS schedule wins for previously untracked devices.
  for(const [key,value] of Object.entries(shared))if(!Object.hasOwn(j.revisions,key)&&!j.pending[key]&&(!remote.has(key)||(['record','setting'].includes(JSON.parse(key)[0])&&inspectionCanonical(value)!==inspectionCanonical(remote.get(key).data))))j.pending[key]={data:value,expectedRevision:null};
  for(const e of data.entities){const key=inspectionEntityKey(e.kind,e.id);if(typeof e.revision!=='string'||!e.data)throw Error('NAS 查檢資料格式不符');if(j.pending[key]){if(inspectionCanonical(j.pending[key].data)===inspectionCanonical(e.data)){delete j.pending[key];delete j.conflicts[key];applyInspectionEntity(next,e);j.revisions[key]=e.revision;}else if(j.pending[key].expectedRevision!==e.revision)j.conflicts[key]=e;}else{applyInspectionEntity(next,e);j.revisions[key]=e.revision;}}
  if(!saveInspectionSyncState(next))throw Error('本機儲存失敗，已停止同步');
  for(const key of Object.keys(inspectionJournal(inspectionState).pending)){
   const current=inspectionJournal(inspectionState),p=current.pending[key];if(!p||current.conflicts[key])continue;
   const [kind,id]=JSON.parse(key),sent=JSON.stringify(p.data),{res,data:reply}=await inspectionRequest('POST',{inspectionVersion:1,kind,id,data:p.data,expectedRevision:p.expectedRevision});
   const updated=JSON.parse(JSON.stringify(inspectionState)),uj=inspectionJournal(updated);
   if(res.status===409){uj.conflicts[key]=reply.entity;saveInspectionSyncState(updated);continue;}
   if(!reply.ok||reply.inspectionVersion!==1||!reply.entity?.revision)throw Error('NAS 未確認查檢儲存');
   uj.revisions[key]=reply.entity.revision;
   if(JSON.stringify(uj.pending[key]?.data)===sent){delete uj.pending[key];delete uj.conflicts[key];}else if(uj.pending[key])uj.pending[key].expectedRevision=reply.entity.revision;
   if(!saveInspectionSyncState(updated))throw Error('本機儲存失敗');
  }
  // Only uploaded thumbnails are fetched on other devices; local full images stay in IndexedDB.
  let pendingPhotos=0;const ids=new Set(inspectionState.records.flatMap(r=>r.items.flatMap(i=>(i.photos||[]).map(p=>p.id))));
  for(const id of ids){const meta=await photoRead('meta',id);if(meta&&meta.status!=='uploaded'){if(!await uploadInspectionPhoto(id))pendingPhotos++;}}
  inspectionSyncMessage='NAS 已同步 · '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})+(pendingPhotos?' · '+pendingPhotos+' 張照片待上傳':'');
  if(!inspectEl.hidden&&!document.getElementById('inspectionForm')&&inspectionView!=='settings')renderInspection();if(selected)renderInspectionMini(selected);
 }catch(e){inspectionSyncMessage=(e.name==='AbortError'?'NAS 同步逾時':e.name==='TypeError'?'NAS 連線失敗':e.message)+' · 本機資料保留';}finally{inspectionSyncBusy=false;inspectionSyncStatus();}
}
document.getElementById('inspectionSyncBtn').onclick=()=>{saveInspectionDraft();syncInspectionNas();};
document.getElementById('inspectionConflictBtn').onclick=()=>{
 const j=inspectionJournal(inspectionState),key=Object.keys(j.conflicts)[0];if(!key)return;
 const [kind,id]=JSON.parse(key),e=j.conflicts[key];
 const keep=confirm('「'+(kind==='record'?'查檢紀錄':id==='reminder'?'提醒偏好':'排程')+'」已被另一台裝置修改。\n按「確定」保留本機版本；按「取消」選擇是否採用 NAS 版本。');if(!keep){if(!e||!confirm('採用 NAS 版本？本機版本會先留存於衝突備份。取消則保留兩份稍後處理。'))return;const next=JSON.parse(JSON.stringify(inspectionState)),nj=inspectionJournal(next);(nj.archivedConflicts||=[]).push({key,data:nj.pending[key].data,at:new Date().toISOString()});delete nj.pending[key];delete nj.conflicts[key];nj.revisions[key]=e.revision;applyInspectionEntity(next,e);if(saveInspectionSyncState(next)){renderInspection();syncInspectionNas();}return;}
 const next=JSON.parse(JSON.stringify(inspectionState)),nj=inspectionJournal(next);nj.pending[key].expectedRevision=e?.revision??null;delete nj.conflicts[key];if(saveInspectionSyncState(next))syncInspectionNas();
};
window.addEventListener('online',syncInspectionNas);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncInspectionNas();});
setInterval(()=>{if(document.visibilityState==='visible'&&!photoBusy)syncInspectionNas();},30000);
setTimeout(syncInspectionNas,1000);


// Refresh server metadata after a successful initial load too. Never interrupt an open editor.
async function refreshEquipmentFromNas(){
 if(document.visibilityState!=='visible'||syncing||layoutReading||hasUnsyncedLayoutChanges||dirtyMetadataIds.size||document.getElementById('panel').classList.contains('open')||document.getElementById('inspectionForm'))return false;
 return loadRemoteLayout();
}
window.addEventListener('online',refreshEquipmentFromNas);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshEquipmentFromNas();});
document.getElementById('refreshAllBtn').onclick=async()=>{
 const b=document.getElementById('refreshAllBtn');b.disabled=true;
 try{
  if(document.getElementById('panel').classList.contains('open'))return toast('請先儲存設備編輯或關閉資料卡，再同步');
  if(!saveInspectionDraft())return;
  if(hasUnsyncedLayoutChanges||dirtyMetadataIds.size){if(!await saveRemoteLayout())return toast(nasReadState.status);}
  const ok=await loadRemoteLayout();await syncInspectionNas();
  toast(ok?'設備資料已更新；查檢同步狀態請查看查檢清單':nasReadState.status);
 }finally{b.disabled=false;}
};
