function loadGLTF(url){
  if(assetCache.has(url))return assetCache.get(url);
  const p=new Promise((resolve,reject)=>{
    assetLoader.load(url,gltf=>resolve(gltf),undefined,reject);
  });
  assetCache.set(url,p);
  return p;
}

function externalAssetFor(name,kind){
  if(kind==='washer' && ['30K','60K','80K'].includes(name))return {url:externalAssets.washer900,scale:{x:5.2,y:5.2,z:5.2},y:.18};
  if(kind==='washer' && ['35kg','50kg'].includes(name))return {url:externalAssets.washer700,scale:{x:5.7,y:5.7,z:5.7},y:.18};
  if(kind==='vertical')return {url:externalAssets.washerRigid,scale:{x:4.9,y:4.9,z:4.9},y:.18};
  if(kind==='dryer')return {url:externalAssets.dryer800,scale:{x:5.5,y:5.5,z:5.5},y:.18};
  if(kind==='longPress'||kind==='flat'||kind==='icc')return {url:externalAssets.flatwork,scale:{x:7.9,y:5.0,z:5.1},y:.18};
  return null;
}

async function attachExternalAsset(root,name,kind,procedural){
  const spec=externalAssetFor(name,kind);
  if(!spec)return;
  try{
    const gltf=await loadGLTF(spec.url);
    if(!groups.has(root.userData.id))return;
    const asset=gltf.scene.clone(true);
    asset.name='GLB-'+root.userData.id;
    asset.position.set(0,spec.y,0);
    asset.scale.set(spec.scale.x,spec.scale.y,spec.scale.z);
    asset.traverse(o=>{
      if(o.isMesh){
        o.castShadow=true;
        o.receiveShadow=true;
        o.userData.root=root;
        o.userData.interactive=true;
      }
    });
    root.remove(procedural);
    root.add(asset);
    root.userData.assetSource=spec.url;
  }catch(err){
    console.warn('3D asset load failed, using procedural fallback:',name,err);
  }
}

function model(type){
  const g=new THREE.Group();
  if(type.startsWith('washer-')) detailWasher(g,type.slice(7));
  else if(type==='washer') detailWasher(g,'standard');
  else if(type==='vertical') detailVertical(g);
  else if(type==='dryer') detailDryer(g);
  else if(type==='longPress') detailPress(g,'press');
  else if(type==='flat') detailPress(g,'flat');
  else if(type==='icc') detailPress(g,'icc');
  else if(type==='shirt') detailShirt(g);
  else if(type==='crane') detailCrane(g);
  else if(type==='office') detailOffice(g);
  else if(type==='smf') detailSMF(g);
  else if(type==='dryclean') detailDryclean(g);
  else if(type==='compressor') detailCompressor(g);
  else if(type==='manganese') detailManganese(g);
  else if(type==='boiler') detailBoiler(g);
  else if(type==='water') detailWater(g);
  else if(type==='tank') detailTank(g);
  else {addMachineBase(g,6,6,0x118fff);g.add(rbox(5,4,5,0xaab7bf,.75,.22));}
  return g;
}

 try{

  const payload=await res.json();const positions=Array.isArray(payload.positions)?payload.positions:[];
  if(positions.length){const byId=new Map(positions.map(v=>[v.id,v]));const byName=new Map(positions.map(v=>[v.name,v]));
   groups.forEach(r=>{const v=byId.get(r.userData.id)||byName.get(r.userData.name);if(v){if(typeof v.x==='number')r.position.x=v.x;if(typeof v.z==='number')r.position.z=v.z;if(typeof v.rotation_y==='number')r.rotation.y=v.rotation_y;else if(typeof v.rotationY==='number')r.rotation.y=v.rotationY;if(r.userData.kind==='icc'&&Math.abs(r.rotation.y)<.001)r.rotation.y=Math.PI/2;if(v.level!=null)r.userData.level=v.level;if(v.status!=null)r.userData.status=v.status;if(v.cleaning_last_date!=null)r.userData.cleaningLastDate=String(v.cleaning_last_date).slice(0,10);if(v.cleaning_cycle_days!=null)r.userData.cleaningCycleDays=Number(v.cleaning_cycle_days);if(v.maintenance_last_date!=null)r.userData.maintenanceLastDate=String(v.maintenance_last_date).slice(0,10);if(v.maintenance_cycle_days!=null)r.userData.maintenanceCycleDays=Number(v.maintenance_cycle_days);if(v.notes!=null)r.userData.notes=v.notes;}});
   localStorage.setItem(SYNC_KEY,JSON.stringify(getPositionData()));
  }
  apiAvailable=true;setSyncBadge('NAS 已連線',true);return true;
 }catch(err){apiAvailable=false;setSyncBadge('NAS 暫離線');return false;}
}
async function saveRemoteLayout(){
 if(syncing||!apiAvailable)return false;
 syncing=true;
 try{
  const res=await fetch(API_BASE+'/api/layout',{
   method:'PUT',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({positions:getPositionData()})
  });
  if(!res.ok)throw new Error('HTTP '+res.status);
  setSyncBadge('NAS 已同步',true); return true;
 }catch(err){apiAvailable=false;setSyncBadge('本機暫存');return false;}
 finally{syncing=false;}
}
function addEquipment(name,type,kind,x,y=0,z=0,level='一樓'){
 const root=new THREE.Group();
 const stableIdMap={'30K':'30K-01','60K':'60K-01','80K':'80K-01','35kg':'W35-01','50kg':'W50-01','直式洗衣機 #01':'VERT-01','直式洗衣機 #02':'VERT-02','直式洗衣機 #03':'VERT-03','N5':'N5-01','IRT':'IRT-01','襯衫機':'SHIRT-01','平燙機':'FLAT-01','整燙區':'FINISH-01','ICC':'ICC-01','烘乾機 #01':'DRY-01','烘乾機 #02':'DRY-02','烘乾機 #03':'DRY-03','天車 #01':'CRANE-01','天車 #02':'CRANE-02','L型桌':'DESK-01','兩層辦公室':'OFFICE-01','冷風區':'FAN-01'};
 const stableExtra={'乾洗機':'DRYCLEAN-01','SMF':'SMF-01','空壓機':'COMP-01','錳砂過濾設備':'MANG-01','鍋爐':'BOILER-01','水設備':'WATER-01','水塔':'TANK-01'};const id=stableIdMap[name] || stableExtra[name] || ('EQ-' + (++uid));
 root.userData={name,type,kind,id,level,status:'正常',cleaningLastDate:'',cleaningCycleDays:30,maintenanceLastDate:'',maintenanceCycleDays:180,notes:''};
 const visualKind=(kind==='washer'&&['30K','60K','80K','35kg','50kg'].includes(name))?('washer-'+name):kind;
 const m=model(visualKind);m.position.y=.25;m.scale.setScalar(.88);root.add(m);
 void attachExternalAsset(root,name,kind,m);if(kind==='icc')root.rotation.y=Math.PI/2;

 const plateW=((kind==='icc'||kind==='longPress')?17:kind==='crane'?5:kind==='fan'?7:kind==='office'?13:8)*.88;
 const plateD=((kind==='icc'||kind==='longPress')?7:kind==='crane'?5:kind==='fan'?7:kind==='office'?10:8)*.88;
 const plateColor=type==='洗衣設備'?0x0877d1:type==='烘乾設備'?0x1bd58d:type==='燙床設備'?0x9b63ff:kind==='fan'?0xf18cb9:0x2a79b9;
 const plate=glowPlate(plateW,plateD,plateColor);plate.position.y=.05;root.add(plate);

 const color=type==='燙床設備'?'#b879ff':type==='烘乾設備'?'#55e7bb':kind==='fan'?'#ff9ac8':'#45c4ff';
 const labelHeight=(kind==='longPress'||kind==='icc')?7.1:kind==='crane'?6.5:kind==='office'?7.2:kind==='vertical'?9.2:6.7;const l=label(name,color);l.position.set(0,labelHeight,0);root.add(l);

 root.position.set(x,y,z);scene.add(root);groups.set(root.userData.id,root);
 root.traverse(o=>{if(o.isMesh){o.userData.root=root;o.userData.interactive=true;}});
 return root;
}
instances.forEach(v=>addEquipment(...v));
function enforceKnownLevels(){
 const raised=new Set(['COMP-01','MANG-01']);
 groups.forEach(r=>{
   if(raised.has(r.userData.id)){r.userData.level='架高二層';r.position.y=7;if(r.userData.id==='COMP-01'){r.position.x=-2;r.position.z=42;}if(r.userData.id==='MANG-01'){r.position.x=32;r.position.z=43;}}
   else {r.userData.level='一樓';r.position.y=0;}
 });
}
restoreSavedPositions();
enforceKnownLevels();

function frameFactory(){
  if(!groups.size)return;
  let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
  groups.forEach(r=>{
    minX=Math.min(minX,r.position.x);
    maxX=Math.max(maxX,r.position.x);
    minZ=Math.min(minZ,r.position.z);
    maxZ=Math.max(maxZ,r.position.z);
  });
  const cx=(minX+maxX)/2;
  const cz=(minZ+maxZ)/2;
  const spanX=Math.max(1,maxX-minX);
  const spanZ=Math.max(1,maxZ-minZ);
  const portrait=innerWidth/innerHeight<0.82;
  const distance=portrait
    ? Math.max(250,Math.max(spanX,spanZ)*2.05)
    : Math.max(190,Math.max(spanX,spanZ)*1.55);
  const dir=new THREE.Vector3(.48,.72,.58).normalize();
  camera.position.copy(new THREE.Vector3(cx,0,cz).addScaledVector(dir,distance));
  controls.target.set(cx,0,cz);
  controls.update();
}

frameFactory();
setTimeout(async()=>{
  await loadRemoteLayout();
  enforceKnownLevels();
  frameFactory();
},0);

function addPalette(){
 const wrap=document.getElementById('items');wrap.innerHTML='';
 palette.forEach(([n,t,k,ic])=>{const b=document.createElement('button');b.className='item';b.dataset.kind=k;b.dataset.type=t;b.innerHTML=`<div class="thumb"></div><span>${n}</span>`;b.onclick=()=>{if(!edit){toast('目前是巡檢模式，請先切換到編輯模式');return;}const r=addEquipment(n,t,k,controls.target.x,0,controls.target.z,'一樓');savePositions();toast('已加入地圖，可直接拖曳');};wrap.appendChild(b)});
}
addPalette();

const ray=new THREE.Raycaster();
function pointerNDC(e){
 const r=renderer.domElement.getBoundingClientRect();
 return {x:((e.clientX-r.left)/r.width)*2-1,y:-((e.clientY-r.top)/r.height)*2+1};
}
function hitEquipment(e){
 const p=pointerNDC(e);
 ray.setFromCamera(new THREE.Vector2(p.x,p.y),camera);
 const hits=ray.intersectObjects(scene.children,true);
 for(const h of hits){
   let o=h.object;
   while(o){
     if(o.userData?.interactive && o.userData?.root) return o.userData.root;
     o=o.parent;
   }
 }
 return null;
}
function groundPoint(e,yLevel=0){
 const p=pointerNDC(e);
 ray.setFromCamera(new THREE.Vector2(p.x,p.y),camera);
 const plane=new THREE.Plane(new THREE.Vector3(0,1,0),-yLevel),out=new THREE.Vector3();
 return ray.ray.intersectPlane(plane,out)?out:null;
}
function select(root){selected=root;if(root)openPanel(root);}
function setPanelEditable(canEdit){['eqName','eqStatus','eqCleaningDate','eqCleaningCycle','eqMaintenanceDate','eqMaintenanceCycle','eqNotes','saveEqBtn','rotateLeftBtn','rotateRightBtn','resetRotationBtn'].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=!canEdit;});}
function openPanel(r){document.getElementById('pn').textContent=r.userData.name;document.getElementById('pt').textContent=r.userData.type;document.getElementById('eqName').value=r.userData.name||'';document.getElementById('eqStatus').value=r.userData.status||'正常';document.getElementById('eqCleaningDate').value=r.userData.cleaningLastDate||'';document.getElementById('eqCleaningCycle').value=Number(r.userData.cleaningCycleDays||30);document.getElementById('eqMaintenanceDate').value=r.userData.maintenanceLastDate||'';document.getElementById('eqMaintenanceCycle').value=Number(r.userData.maintenanceCycleDays||180);document.getElementById('eqNotes').value=r.userData.notes||'';document.getElementById('eqId').textContent=r.userData.id||'—';document.getElementById('eqKind').textContent=r.userData.kind||'—';setPanelEditable(edit);document.getElementById('panel').classList.add('open');}
function closePanel(){document.getElementById('panel').classList.remove('open');}
function toast(s){
 const t=document.getElementById('toast');
 t.textContent=s;t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),1500);
}
function getPositionData(){
 return [...groups.values()].map(r=>({id:r.userData.id,name:r.userData.name,type:r.userData.type,kind:r.userData.kind,x:r.position.x,z:r.position.z,rotationY:r.rotation.y,level:r.userData.level||'一樓',status:r.userData.status||'正常',cleaningLastDate:r.userData.cleaningLastDate||'',cleaningCycleDays:Number(r.userData.cleaningCycleDays||30),maintenanceLastDate:r.userData.maintenanceLastDate||'',maintenanceCycleDays:Number(r.userData.maintenanceCycleDays||180),notes:r.userData.notes||''}));
}
function savePositions(){
 const data=JSON.stringify(getPositionData());
 localStorage.setItem(SYNC_KEY,data);
 try{
  const req=indexedDB.open('factory3d-db',1);
  req.onupgradeneeded=()=>req.result.createObjectStore('layout');
  req.onsuccess=()=>{
   const db=req.result;
   const tx=db.transaction('layout','readwrite');
   tx.objectStore('layout').put({id:'current',data});
  };
 }catch(err){}
 void saveRemoteLayout();
}
function restoreSavedPositions(){
 try{
   const raw=localStorage.getItem('factory3dPositions');
   if(!raw)return false;
   const saved=JSON.parse(raw);
   const byId=new Map(saved.map(v=>[v.id,v]));
   groups.forEach(r=>{
     const v=byId.get(r.userData.id);
     if(v){r.position.x=v.x;r.position.z=v.z;r.rotation.y=typeof v.rotationY==='number'?v.rotationY:0;if(r.userData.kind==='icc'&&Math.abs(r.rotation.y)<.001)r.rotation.y=Math.PI/2;Object.assign(r.userData,{name:v.name||r.userData.name,status:v.status||r.userData.status,cleaningLastDate:v.cleaningLastDate||'',cleaningCycleDays:Number(v.cleaningCycleDays||r.userData.cleaningCycleDays),maintenanceLastDate:v.maintenanceLastDate||'',maintenanceCycleDays:Number(v.maintenanceCycleDays||r.userData.maintenanceCycleDays),notes:v.notes||''});}
   });
   return true;
 }catch(err){return false;}
}
function exportLayout(){
 const blob=new Blob([JSON.stringify({version:1,savedAt:new Date().toISOString(),positions:getPositionData()},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='factory-layout.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importLayout(file){
 const reader=new FileReader();
 reader.onload=()=>{
   try{
     const saved=JSON.parse(reader.result);
     const list=saved.positions||saved;
     const byName=new Map(list.map(v=>[v.name,v]));
     groups.forEach(r=>{
       const v=byName.get(r.userData.name);
       if(v){r.position.x=v.x;r.position.z=v.z;r.rotation.y=v.rotationY||0;r.userData.level=v.level||r.userData.level;}
     });
     savePositions();toast('版位已匯入');
   }catch(err){toast('匯入檔案格式不正確');}
 };
 reader.readAsText(file);
}
function snapValue(v){return snap?Math.round(v/5)*5:v;}

renderer.domElement.addEventListener('pointerdown',e=>{
 if(!edit)return;
 const r=hitEquipment(e);
 if(!r)return;
 if(drag){drag=null;}
 if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
 activePointerId=e.pointerId;
 try{renderer.domElement.setPointerCapture?.(e.pointerId);}catch(err){}
 drag={root:r,longPressed:false,moved:false,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY};
 if(e.pointerType==='mouse'){
   drag.longPressed=true;controls.enabled=false;renderer.domElement.style.cursor='grabbing';
 }else{
   pressTimer=setTimeout(()=>{
     if(!drag||drag.pointerId!==e.pointerId)return;
     drag.longPressed=true;controls.enabled=false;renderer.domElement.style.cursor='grabbing';toast('拖曳中：移動到你要的位置');
   },380);
 }
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!drag||drag.pointerId!==e.pointerId||!drag.longPressed)return;
 const world=groundPoint(e,drag.root.position.y);
 if(!world)return;
 drag.root.position.x=snapValue(world.x);
 drag.root.position.z=snapValue(world.z);
 drag.moved=true;
});
function finishPointer(e, cancelled=false){
 if(!drag)return;
 if(drag.pointerId!==e.pointerId && !cancelled)return;
 if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
 const r=drag.root;const wasDrag=!cancelled&&drag.longPressed&&drag.moved;
 try{if(renderer.domElement.hasPointerCapture?.(e.pointerId))renderer.domElement.releasePointerCapture(e.pointerId);}catch(err){}
 drag=null;activePointerId=null;controls.enabled=true;renderer.domElement.style.cursor='';
 if(!cancelled){if(!wasDrag)select(r);else{savePositions();toast('位置已更新');}}
}
renderer.domElement.addEventListener('pointerup',e=>finishPointer(e,false));
renderer.domElement.addEventListener('pointercancel',e=>finishPointer(e,true));
renderer.domElement.addEventListener('lostpointercapture',e=>{if(drag&&drag.pointerId===e.pointerId)finishPointer(e,true);});

document.getElementById('saveEqBtn').onclick=async()=>{if(!selected)return;selected.userData.name=document.getElementById('eqName').value.trim()||selected.userData.name;selected.userData.status=document.getElementById('eqStatus').value;selected.userData.cleaningLastDate=document.getElementById('eqCleaningDate').value;selected.userData.cleaningCycleDays=Math.max(0,Number(document.getElementById('eqCleaningCycle').value||0));selected.userData.maintenanceLastDate=document.getElementById('eqMaintenanceDate').value;selected.userData.maintenanceCycleDays=Math.max(0,Number(document.getElementById('eqMaintenanceCycle').value||0));selected.userData.notes=document.getElementById('eqNotes').value;const lbl=selected.children.find(o=>o.isCSS2DObject);if(lbl)lbl.element.textContent=selected.userData.name;document.getElementById('pn').textContent=selected.userData.name;savePositions();if(apiAvailable)await saveRemoteLayout();toast('設備資料已同步至 NAS');};
document.getElementById('rotateLeftBtn').onclick=()=>{if(!selected||!edit)return;selected.rotation.y-=Math.PI/2;savePositions();toast('設備已左轉 90°');};
document.getElementById('rotateRightBtn').onclick=()=>{if(!selected||!edit)return;selected.rotation.y+=Math.PI/2;savePositions();toast('設備已右轉 90°');};

document.getElementById('close').onclick=closePanel;

};

};
document.getElementById('resetBtn').onclick=()=>frameFactory();

 snap=!snap;

};
document.getElementById('saveBtn').onclick=async()=>{

};
document.getElementById('exportBtn').onclick=exportLayout;
document.getElementById('importInput').onchange=e=>{if(e.target.files[0])importLayout(e.target.files[0]);};
document.getElementById('search').oninput=e=>{

};

setInterval(()=>{if(!apiAvailable&&!syncing)loadRemoteLayout();},15000);
function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 labels.setSize(innerWidth,innerHeight);
 frameFactory();
}
addEventListener('resize',resize);
function animate(){
 requestAnimationFrame(animate);controls.update();
 renderer.render(scene,camera);labels.render(scene,camera);
}
animate();
