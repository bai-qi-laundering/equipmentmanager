<title>洗滌廠 3D 設備地圖</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#163b60 0,#091a2b 38%,#030913 82%,#01050a 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
#app{position:fixed;inset:0}#canvas{position:absolute;inset:0;touch-action:none;background:radial-gradient(circle at 50% 45%,rgba(20,85,132,.10),transparent 48%)}
.top{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:max(8px,env(safe-area-inset-top));width:min(1180px,calc(100% - 24px));height:58px;display:flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid rgba(50,156,236,.44);border-radius:18px;background:linear-gradient(180deg,rgba(5,20,38,.92),rgba(4,14,28,.78));backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.05)}

button,select,input{font:inherit;color:#fff;border:1px solid rgba(54,128,182,.72);background:rgba(10,39,68,.82);border-radius:12px;padding:9px 12px;box-shadow:inset 0 1px rgba(255,255,255,.05)}
button{cursor:pointer}button.active{background:linear-gradient(180deg,#148ed3,#086eb1);border-color:#45c6ff;box-shadow:0 0 18px rgba(41,176,255,.24),inset 0 1px rgba(255,255,255,.18)}.search{width:240px}
.side{position:fixed;z-index:29;left:14px;top:84px;bottom:auto;width:auto;display:flex;gap:7px;padding:7px;border:1px solid rgba(35,112,164,.45);border-radius:16px;background:rgba(4,17,31,.50);backdrop-filter:blur(14px);box-shadow:0 10px 28px rgba(0,0,0,.18)}
.side button{padding:9px 11px;font-size:12px}.side button:first-child{background:linear-gradient(180deg,rgba(8,126,193,.95),rgba(6,86,138,.9));border-color:#36bbff}
.palette{position:fixed;z-index:28;left:50%;transform:translateX(-50%);bottom:14px;width:min(1180px,calc(100% - 24px));height:112px;padding:8px 12px 10px;border:1px solid rgba(35,112,164,.40);border-radius:18px;background:linear-gradient(180deg,rgba(5,19,36,.82),rgba(3,12,23,.94));backdrop-filter:blur(18px);overflow:hidden;box-shadow:0 -12px 36px rgba(0,0,0,.20)}
.palette h3{margin:0 0 5px;font-size:12px;color:#a7dcf7}.items{display:flex;gap:8px;min-width:max-content;height:76px;overflow-x:auto;overflow-y:hidden;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:#2f86bd transparent}
.item{flex:0 0 94px;width:94px;height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(49,121,173,.55);border-radius:12px;background:linear-gradient(180deg,rgba(13,41,69,.82),rgba(8,25,44,.84));box-shadow:inset 0 0 18px rgba(43,175,255,.03),0 8px 20px rgba(0,0,0,.12)}.item:active{transform:scale(.97)}
.thumb{width:54px;height:34px;display:flex;align-items:center;justify-content:center;font-size:0;position:relative}
.thumb:before{content:'';display:block;width:34px;height:24px;border-radius:5px;border:2px solid #8bd8ff;background:linear-gradient(145deg,#dfe7eb,#71808a);box-shadow:0 0 10px rgba(42,168,255,.32),inset 0 0 7px rgba(255,255,255,.25)}
.thumb:after{content:'◉';position:absolute;font-size:15px;line-height:1;color:#132838;text-shadow:0 0 5px #75d9ff}
.item[data-kind="dryer"] .thumb:before{border-color:#55e7bb;box-shadow:0 0 10px rgba(27,213,141,.28)}
.item[data-kind="press"] .thumb:before,.item[data-kind="longPress"] .thumb:before,.item[data-kind="icc"] .thumb:before,.item[data-kind="shirt"] .thumb:before{border-color:#b879ff;box-shadow:0 0 10px rgba(155,99,255,.28)}
.item[data-kind="compressor"] .thumb:before,.item[data-kind="manganese"] .thumb:before{border-color:#8bd8ff}.item span{font-size:12px;font-weight:800}
.panel{position:fixed;z-index:40;right:12px;top:76px;width:min(380px,calc(100% - 24px));max-height:calc(100% - 160px);height:auto;padding:18px;background:rgba(5,19,35,.95);border:1px solid rgba(43,132,192,.56);border-radius:18px;transform:translateX(115%);transition:.22s;overflow:auto;box-shadow:0 22px 50px rgba(0,0,0,.38);backdrop-filter:blur(18px)}.panel.open{transform:none}
.close{position:absolute;right:14px;top:14px;border-radius:50%;width:40px;height:40px;padding:0;font-size:22px}
.panel h2{margin:18px 44px 4px 2px;font-size:22px}.muted{color:#91abc2}.card{margin-top:16px;padding:14px;border:1px solid #1b496e;border-radius:14px;background:#0a2037}.row{display:flex;justify-content:space-between;margin:10px 0}.ok{color:#55e5bd}.warn{color:#ffd166}.panel label{display:block;margin:10px 0 5px;color:#9ec4dc;font-size:12px}.panel input,.panel select,.panel textarea{background:#071a2d;border:1px solid #245b88;border-radius:9px;color:#fff;padding:9px 10px}
.hint{position:fixed;z-index:31;left:50%;top:76px;transform:translateX(-50%);padding:5px 11px;border:1px solid rgba(43,124,180,.34);border-radius:999px;background:rgba(4,18,32,.46);color:#a7c4d8;font-size:11px;pointer-events:none;letter-spacing:.15px;backdrop-filter:blur(10px)}
.eq-label{transform:translateY(-2px);transition:opacity .15s;filter:drop-shadow(0 5px 8px rgba(0,0,0,.72))}
.eq-label{padding:6px 10px!important;border-radius:12px!important;background:linear-gradient(180deg,rgba(5,23,40,.96),rgba(3,13,25,.88))!important;box-shadow:0 0 0 1px rgba(77,194,255,.10),0 0 18px currentColor!important;font-size:12px!important;line-height:1!important}
.quick-rotate{position:fixed;z-index:34;right:18px;top:78px;display:flex;gap:6px;align-items:center;padding:5px;border:1px solid rgba(48,139,200,.45);border-radius:13px;background:rgba(4,18,32,.72);backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.22)}.quick-rotate button{padding:7px 9px;font-size:12px;font-weight:800}.quick-rotate button:disabled{opacity:.38;cursor:not-allowed}.quick-rotate button:not(:disabled){border-color:#43c5ff;box-shadow:0 0 12px rgba(51,190,255,.22)}@media(max-width:700px){
 .top{top:max(6px,env(safe-area-inset-top));height:52px;width:calc(100% - 14px);padding:6px 8px;border-radius:16px;gap:5px}
 .logo{font-size:15px}.top select{width:108px;padding-left:8px;padding-right:8px}.top .search{width:138px;height:38px}.mode{display:none}
 .side{left:8px;top:66px;gap:5px;padding:5px;border-radius:14px;opacity:.72}.side button{padding:7px 8px;font-size:10px}
 .hint{display:none}.eq-label{font-size:10px!important;padding:5px 8px!important;border-radius:10px!important}
 .palette{bottom:max(8px,env(safe-area-inset-bottom));width:calc(100% - 14px);height:86px;padding:6px 8px 7px;border-radius:15px}
 .palette h3{font-size:10px;margin-bottom:3px}.items{gap:6px}.item{width:76px;height:55px;border-radius:10px}.thumb{width:42px;height:23px}.thumb:before{width:28px;height:18px}.thumb:after{font-size:12px}.item span{font-size:10px}
}
#toast{position:fixed;z-index:50;left:50%;bottom:126px;transform:translate(-50%,20px);opacity:0;padding:10px 15px;border-radius:12px;background:rgba(12,43,72,.92);border:1px solid #2d83bc;transition:.2s;backdrop-filter:blur(10px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.reference-actions{position:fixed;z-index:32;right:14px;bottom:138px;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.reference-actions button{font-size:12px;padding:8px 10px;background:rgba(5,22,39,.72)}
@media(max-width:700px){.reference-actions{right:8px;bottom:102px;gap:5px}.reference-actions button{font-size:10px;padding:7px 8px}}
.thumb3d{width:54px;height:34px;display:flex;align-items:center;justify-content:center;font-size:23px;line-height:1;background:radial-gradient(circle at 50% 35%,rgba(69,196,255,.28),rgba(8,24,41,.18) 60%,transparent 70%);text-shadow:0 0 8px #56cfff,0 2px 2px rgba(0,0,0,.9);filter:drop-shadow(0 0 6px rgba(53,196,255,.45))}.item[data-kind="dryer"] .thumb3d{color:#55e7bb;text-shadow:0 0 8px #55e7bb}.item[data-kind="longPress"] .thumb3d,.item[data-kind^="line"] .thumb3d{color:#b879ff;text-shadow:0 0 8px #b879ff}</style>
</head>
<body>
<div id="app"><div id="canvas"></div>
<div class="top">
  <div class="logo">▱ 洗滌廠 3D 設備地圖</div>
  <select id="filter"><option>全部設備</option><option>洗衣設備</option><option>烘乾設備</option><option>燙床設備</option><option>整燙設備</option><option>周邊設備</option></select>
  <input class="search" id="search" placeholder="搜尋設備名稱…">
  <div class="mode"><button id="editBtn" class="active">編輯模式</button><button id="viewBtn">巡檢模式</button><button id="resetBtn">重置視角</button></div><div class="quick-rotate"><button id="quickRotateLeft" disabled>↶ 左轉90°</button><button id="quickRotateRight" disabled>↷ 右轉90°</button><button id="quickRotateReset" disabled>⟳ 重設</button></div>
</div>
<div class="hint" id="hint">編輯模式：短點查看資料；長按拖曳；右側可旋轉設備與編輯資料；雙指操作地圖</div><div id="syncBadge" style="position:fixed;z-index:11;right:18px;top:82px;padding:6px 10px;border-radius:999px;background:rgba(5,20,38,.72);border:1px solid #245b88;color:#a9c9df;font-size:12px;pointer-events:none">資料同步：檢查中</div>
<div class="side"><button>▧<br>地圖</button><button>⚙<br>設備</button><button>✓<br>清潔</button><button>◷<br>保養</button><button>⚒<br>維修</button></div>
<div class="palette"><h3>設備庫 （點一下加入地圖，再長按拖曳到想要的位置）</h3><div class="items" id="items"></div></div><div class="reference-actions"><button id="snapBtn">吸附：開</button><button id="saveBtn">💾 儲存</button><button id="exportBtn">⬇️ 匯出版位</button><label style="padding:9px 12px;border:1px solid #245b88;background:#0a2744;border-radius:10px;cursor:pointer">⬆️ 匯入版位<input id="importInput" type="file" accept="application/json" style="display:none"></label></div>
<div class="panel" id="panel"><button class="close" id="close">×</button><h2 id="pn">設備</h2><div class="muted" id="pt">設備</div><div class="card"><label>設備名稱</label><input id="eqName" style="width:100%"><label>狀態</label><select id="eqStatus" style="width:100%"><option>正常</option><option>待保養</option><option>維修中</option><option>停用</option></select><label>上次清潔</label><input id="eqCleaningDate" type="date" style="width:100%"><label>清潔週期（天）</label><input id="eqCleaningCycle" type="number" min="0" style="width:100%"><label>上次保養</label><input id="eqMaintenanceDate" type="date" style="width:100%"><label>保養週期（天）</label><input id="eqMaintenanceCycle" type="number" min="0" style="width:100%"><label>備註</label><textarea id="eqNotes" rows="4" style="width:100%;resize:vertical"></textarea><button id="saveEqBtn" style="width:100%;margin-top:14px">💾 儲存設備資料</button></div><div class="card"><div style="font-weight:800;margin-bottom:8px">設備方向</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button id="rotateLeftBtn">↶ 左轉 90°</button><button id="rotateRightBtn">↷ 右轉 90°</button></div><button id="resetRotationBtn" style="width:100%;margin-top:8px">⟳ 重設方向</button></div><div class="card"><div style="font-weight:800;margin-bottom:8px">設備大小</div><div style="display:flex;align-items:center;gap:8px"><button id="scaleDownBtn" type="button">－</button><input id="eqScale" type="range" min="0.5" max="2.5" step="0.05" value="1" style="flex:1;min-width:0"><button id="scaleUpBtn" type="button">＋</button><b id="eqScaleValue" style="min-width:45px">100%</b></div><button id="deleteEqBtn" type="button" style="width:100%;margin-top:14px;border-color:#c65a67;color:#ffd8dd">刪除這台設備</button></div><div class="card" style="color:#91abc2;font-size:12px"><div class="row"><span>設備編號</span><b id="eqId">—</b></div><div class="row"><span>模型</span><b id="eqKind">—</b></div></div><div class="card"><button style="width:100%;margin:4px 0">＋ 新增清潔紀錄</button><button style="width:100%;margin:4px 0">＋ 新增保養紀錄</button><button style="width:100%;margin:4px 0">＋ 新增維修紀錄</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer,CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const gltfLoader=new GLTFLoader();
const embeddedImages={'crane-front.png':'data:image/png;
// 舊版圖片模型：保留你喜歡的正面設備素材；旋轉時切換對應側面示意圖，設備資料仍掛在同一個 root。
const spriteSpecs={
 folding:{file:'folding.png',w:17,h:7,color:'#168ee1'},
 washer:{file:'washer-front.png',w:7.5,h:7.5,color:'#c8d8e3'},
 'washer-35kg':{file:'washer-front.png',w:7.2,h:7.2,color:'#c8d8e3'},
 'washer-50kg':{file:'washer-front.png',w:7.6,h:7.5,color:'#c8d8e3'},
 vertical:{file:'washer-front.png',w:6.5,h:8.8,color:'#c8d8e3'},
 dryer:{file:'dryer-front.png',w:7.8,h:7.5,color:'#c8d8e3'},
 manganese:{file:'manganese-front.png',w:18,h:12,color:'#167bca',offsetY:-7},
 crane:{file:'crane-front.png',w:9.8,h:7.5,color:'#e7a925'}
};
const spriteLoader=new THREE.TextureLoader();
const spriteFrontCache=new Map(),spriteTurnCache=new Map();
function frontTexture(spec){
 const url='./assets/'+spec.file;
 if(!spriteFrontCache.has(url)){
  const t=spriteLoader.load(url,()=>{t.colorSpace=THREE.SRGBColorSpace;});
  t.colorSpace=THREE.SRGBColorSpace;spriteFrontCache.set(url,t);
 }
 return spriteFrontCache.get(url);
}
function turnedTexture(spec,side){
 const key=spec.file+':'+side;if(spriteTurnCache.has(key))return spriteTurnCache.get(key);
 const cv=document.createElement('canvas');cv.width=512;cv.height=512;const x=cv.getContext('2d');
 const left=side===1,right=side===3,back=side===2;
 const width=back?320:205,px=(512-width)/2;x.shadowBlur=24;x.shadowColor='rgba(0,0,0,.5)';
 const g=x.createLinearGradient(px,100,px+width,400);g.addColorStop(0,'#f5f8fa');g.addColorStop(.55,spec.color);g.addColorStop(1,'#344d60');
 x.fillStyle=g;x.fillRect(px,120,width,300);x.shadowBlur=0;x.strokeStyle='#a8c5d5';x.lineWidth=7;x.strokeRect(px+3,123,width-6,294);
 x.fillStyle='#263c4d';x.fillRect(px+16,148,width-32,34);x.fillStyle='#7aa9c7';x.fillRect(px+22,218,width-44,6);x.fillRect(px+22,315,width-44,6);
 if(left||right){x.fillStyle='#213b50';x.fillRect(px+(left?24:width-49),205,25,90);}
 x.fillStyle='#536b7c';x.fillRect(px+22,420,38,28);x.fillRect(px+width-60,420,38,28);
 const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;spriteTurnCache.set(key,t);return t;
}
function attachEquipmentSprite(root,kind){
 const spec=spriteSpecs[kind];if(!spec)return false;
 const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:frontTexture(spec),transparent:true,depthTest:false,depthWrite:false,alphaTest:.06,toneMapped:false}));
 sprite.renderOrder=18;sprite.scale.set(spec.w,spec.h,1);sprite.position.y=(spec.offsetY||0)+spec.h/2+.18;
 sprite.userData.root=root;sprite.userData.interactive=true;root.add(sprite);root.userData.pictureSprite=sprite;root.userData.spriteSpec=spec;root.userData.lastSpriteTurn=0;return true;
}
function syncEquipmentSprite(root){
 const sprite=root?.userData?.pictureSprite;if(!sprite)return;
 const turn=((Math.round(root.rotation.y/(Math.PI/2))%4)+4)%4;if(root.userData.lastSpriteTurn===turn)return;
 root.userData.lastSpriteTurn=turn;sprite.material.map=turn===0?frontTexture(root.userData.spriteSpec):turnedTexture(root.userData.spriteSpec,turn);sprite.material.needsUpdate=true;
}

const externalAssets={
 washer35:'https://cdn.3dassets.dev/assets/25512/v1/model.glb',
 vertical:'https://cdn.3dassets.dev/assets/25511/v1/model.glb',
 dryer:'https://cdn.3dassets.dev/assets/25514/v1/model.glb',
 flatwork:'https://cdn.3dassets.dev/assets/25534/v1/model.glb',
 press:'https://cdn.3dassets.dev/assets/25535/v1/model.glb',
 dryclean:'https://cdn.3dassets.dev/assets/25556/v1/model.glb',
 boiler:'https://cdn.3dassets.dev/assets/34954/v1/model.glb'
};
const glbCache=new Map();
function loadGLB(url){
 if(glbCache.has(url))return glbCache.get(url);
 const p=new Promise((resolve,reject)=>gltfLoader.load(url,g=>resolve(g.scene),undefined,reject));
 glbCache.set(url,p);return p;
}
function externalSpec(name,kind){
 // 舊版模型呈現：洗衣機、直式洗衣機、烘乾機等優先使用內建細節模型；
 // 只有需要外部 GLB 的設備才載入 GLB。
 if(kind==='longPress')return {url:externalAssets.press,scale:6.0,y:.18};
 if(kind==='flat')return {url:externalAssets.flatwork,scale:5.7,y:.18};
 if(kind==='dryclean')return {url:externalAssets.dryclean,scale:5.0,y:.18};
 if(kind==='boiler')return {url:externalAssets.boiler,scale:5.4,y:.18};
 return null;
}
async function attachGLB(root,name,kind,procedural){
 const spec=externalSpec(name,kind);if(!spec)return;
 try{
  const source=await loadGLB(spec.url);
  if(!groups.has(root.userData.id))return;
  const asset=source.clone(true);
  asset.position.y=spec.y;asset.scale.setScalar(spec.scale);
  asset.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.userData.root=root;o.userData.interactive=true;}});
  root.remove(procedural);root.add(asset);root.userData.assetSource=spec.url;
 }catch(e){console.warn('GLB fallback',name,e);}
}

const DELETE_KEY='factory3dDeletedIds';
const deletedIds=new Set(JSON.parse(localStorage.getItem(DELETE_KEY)||'[]'));
function saveDeletedIds(){localStorage.setItem(DELETE_KEY,JSON.stringify([...deletedIds]));}
function setEquipmentScale(root,value){
 const scale=Math.min(2.5,Math.max(.5,Number(value)||1));
 root.userData.visualScale=scale;
 root.scale.setScalar(scale);
 if(root===selected){
  document.getElementById('eqScale').value=scale;
  document.getElementById('eqScaleValue').textContent=Math.round(scale*100)+'%';
 }
}
const app=document.getElementById('canvas'), scene=new THREE.Scene();
scene.background=new THREE.Color(0x14324a);
scene.fog=new THREE.Fog(0x14324a,190,520);

const camera=new THREE.OrthographicCamera(-100,100,100,-100,-1000,2000);
camera.position.set(120,170,190);
camera.zoom=1;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.72; 
app.appendChild(renderer.domElement);

const labels=new CSS2DRenderer();
labels.setSize(innerWidth,innerHeight);
labels.domElement.style.position='absolute';
labels.domElement.style.inset='0';
labels.domElement.style.pointerEvents='none';
app.appendChild(labels.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.07;
controls.enablePan=true;
controls.screenSpacePanning=true;
controls.panSpeed=.55;
controls.rotateSpeed=.34;
controls.zoomSpeed=.5;
controls.touches.ONE=THREE.TOUCH.PAN;
controls.touches.TWO=THREE.TOUCH.DOLLY_ROTATE;
controls.maxPolarAngle=Math.PI*.49;
controls.minDistance=50;
controls.maxDistance=600;
controls.target.set(7,0,0);

// --- 建立環境光譜反射圖 (Environment Map) 提升金屬質感 ---
const envCanvas = document.createElement('canvas');
envCanvas.width = 512; envCanvas.height = 256;
const envCtx = envCanvas.getContext('2d');
const envGrd = envCtx.createLinearGradient(0, 0, 0, 256);
envGrd.addColorStop(0, '#091524');
envGrd.addColorStop(0.4, '#1b4d7a');
envGrd.addColorStop(0.5, '#62c2ff');
envGrd.addColorStop(0.6, '#1b4d7a');
envGrd.addColorStop(1, '#050d14');
envCtx.fillStyle = envGrd; envCtx.fillRect(0, 0, 512, 256);
envCtx.fillStyle = '#ffffff';
envCtx.shadowColor = '#ffffff'; envCtx.shadowBlur = 15;
envCtx.fillRect(100, 100, 50, 20);

function mat(c,rough=.35,metal=.65,opacity=1){
  const transparent=opacity<.999;
  const m=new THREE.MeshStandardMaterial({
    color:c,roughness:rough,metalness:metal,
    transparent,opacity,
    depthWrite:!transparent,
    side:THREE.DoubleSide
  });
  // 半透明科技材質在某些視角容易因背面剔除/深度排序而「消失」。
  // 讓設備外殼雙面可見，確保旋轉視角時不會突然變透明。
  return m;
}
function glassMat(c=0x88ccff, op=0.8){
  return new THREE.MeshPhysicalMaterial({

    transmission: 0.9, thickness: 0.5, transparent: true, opacity: op, ior: 1.5
  });
}

function boostProceduralModel(g,kind){
  const externalKinds=new Set(['washer-35kg','washer-50kg','vertical','dryer','longPress','flat','dryclean','boiler']);
  if(externalKinds.has(kind))return;
  g.traverse(o=>{
   if(!o.isMesh||!o.material||!o.material.isMeshStandardMaterial)return;
   const m=o.material;
   if(m.transparent&&m.opacity<.7)return;
   const base=m.color?m.color.clone():new THREE.Color(0xffffff);
   m.emissive=base.clone().multiplyScalar(.16);
   m.emissiveIntensity=.5;
   m.roughness=Math.min(m.roughness||.4,.55);
  });
  if(['lineN5','lineIRT','lineSMF','lineICC','icc'].includes(kind)){
   g.traverse(o=>{
    if(o.isMesh&&o.material&&o.material.color){
     const h=o.material.color.getHex();
     if(h===0x1c64a5||h===0x2a78ba||h===0x2f87c6||h===0x3b91c7){
      o.material.color.setHex(0x4ba5d6);
      o.material.emissive=new THREE.Color(0x176b9f);
      o.material.emissiveIntensity=.9;
     }
    }
   });
  }
}

function frameFactory(){
  if(!groups.size)return;
  let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
  groups.forEach(r=>{
    minX=Math.min(minX,r.position.x);
    maxX=Math.max(maxX,r.position.x);
    minZ=Math.min(minZ,r.position.z);
    maxZ=Math.max(maxZ,r.position.z);
  });
  const cx=(minX+maxX)/2;
  const cz=(minZ+maxZ)/2;
  const spanX=Math.max(1,maxX-minX);
  const spanZ=Math.max(1,maxZ-minZ);
  const aspect=innerWidth/innerHeight;
  const portrait=aspect<0.82;
  const fit=Math.max(spanX,spanZ)*(portrait?.68:1.02)+10;
  const base=100;
  camera.left=-base*aspect;
  camera.right=base*aspect;
  camera.top=base;
  camera.bottom=-base;
  camera.near=-1000;
  camera.far=2000;
  camera.zoom=base/fit;
  const dir=new THREE.Vector3(.62,.72,.68).normalize();
  camera.position.copy(new THREE.Vector3(cx,12,cz).addScaledVector(dir,260));
  controls.target.set(cx,1.6,cz);
  controls.update();
  camera.updateProjectionMatrix();
}

const ray=new THREE.Raycaster();
function pointerNDC(e){
 const r=renderer.domElement.getBoundingClientRect();
 return {x:((e.clientX-r.left)/r.width)*2-1,y:-((e.clientY-r.top)/r.height)*2+1};
}
function hitEquipment(e){
 const p=pointerNDC(e);
 ray.setFromCamera(new THREE.Vector2(p.x,p.y),camera);
 const hits=ray.intersectObjects(scene.children,true);
 for(const h of hits){
   let o=h.object;
   while(o){
     if(o.userData?.interactive && o.userData?.root) return o.userData.root;
     o=o.parent;
   }
 }
 return null;
}
function groundPoint(e,yLevel=0){
 const p=pointerNDC(e);
 ray.setFromCamera(new THREE.Vector2(p.x,p.y),camera);
 const plane=new THREE.Plane(new THREE.Vector3(0,1,0),-yLevel),out=new THREE.Vector3();
 return ray.ray.intersectPlane(plane,out)?out:null;
}
function select(root){selected=root;if(root)openPanel(root);syncQuickRotate?.();}
function setPanelEditable(canEdit){['eqScale','scaleDownBtn','scaleUpBtn','deleteEqBtn','eqName','eqStatus','eqCleaningDate','eqCleaningCycle','eqMaintenanceDate','eqMaintenanceCycle','eqNotes','saveEqBtn','rotateLeftBtn','rotateRightBtn','resetRotationBtn'].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=!canEdit;});}
function openPanel(r){document.getElementById('pn').textContent=r.userData.name;document.getElementById('pt').textContent=r.userData.type;document.getElementById('eqName').value=r.userData.name||'';document.getElementById('eqStatus').value=r.userData.status||'正常';document.getElementById('eqCleaningDate').value=r.userData.cleaningLastDate||'';document.getElementById('eqCleaningCycle').value=Number(r.userData.cleaningCycleDays||30);document.getElementById('eqMaintenanceDate').value=r.userData.maintenanceLastDate||'';document.getElementById('eqMaintenanceCycle').value=Number(r.userData.maintenanceCycleDays||180);document.getElementById('eqNotes').value=r.userData.notes||'';document.getElementById('eqId').textContent=r.userData.id||'—';document.getElementById('eqKind').textContent=r.userData.kind||'—';setEquipmentScale(r,r.userData.visualScale||1);setPanelEditable(edit);document.getElementById('panel').classList.add('open');}

function toast(s){

function getPositionData(){
 return [...groups.values()].map(r=>({id:r.userData.id,name:r.userData.name,type:r.userData.type,kind:r.userData.kind,x:r.position.x,z:r.position.z,rotationY:r.rotation.y,visualScale:r.userData.visualScale||1,level:r.userData.level||'一樓',status:r.userData.status||'正常',cleaningLastDate:r.userData.cleaningLastDate||'',cleaningCycleDays:Number(r.userData.cleaningCycleDays||30),maintenanceLastDate:r.userData.maintenanceLastDate||'',maintenanceCycleDays:Number(r.userData.maintenanceCycleDays||180),notes:r.userData.notes||''}));
}
function savePositions(){
 const data=JSON.stringify(getPositionData());
 localStorage.setItem(SYNC_KEY,data);
 try{
  const req=indexedDB.open('factory3d-db',1);
  req.onupgradeneeded=()=>req.result.createObjectStore('layout');
  req.onsuccess=()=>{
   const db=req.result;
   const tx=db.transaction('layout','readwrite');
   tx.objectStore('layout').put({id:'current',data});
  };
 }catch(err){}
 void saveRemoteLayout();
}
function restoreSavedPositions(){
 try{
   const raw=localStorage.getItem('factory3dPositions');
   if(!raw)return false;
   const saved=JSON.parse(raw);
   const byId=new Map(saved.map(v=>[v.id,v]));
   groups.forEach(r=>{
     const v=byId.get(r.userData.id);
     if(v){r.position.x=v.x;r.position.z=v.z;r.rotation.y=typeof v.rotationY==='number'?v.rotationY:0;r.userData.visualScale=Number(v.visualScale||1);setEquipmentScale(r,r.userData.visualScale);if(r.userData.kind==='icc'&&Math.abs(r.rotation.y)<.001)r.rotation.y=Math.PI/2;Object.assign(r.userData,{name:v.name||r.userData.name,status:v.status||r.userData.status,cleaningLastDate:v.cleaningLastDate||'',cleaningCycleDays:Number(v.cleaningCycleDays||r.userData.cleaningCycleDays),maintenanceLastDate:v.maintenanceLastDate||'',maintenanceCycleDays:Number(v.maintenanceCycleDays||r.userData.maintenanceCycleDays),notes:v.notes||''});syncEquipmentSprite(r);}
   });
   return true;
 }catch(err){return false;}
}
function exportLayout(){
 const blob=new Blob([JSON.stringify({version:1,savedAt:new Date().toISOString(),positions:getPositionData()},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='factory-layout.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importLayout(file){
 const reader=new FileReader();
 reader.onload=()=>{
   try{
     const saved=JSON.parse(reader.result);
     const list=saved.positions||saved;
     const byName=new Map(list.map(v=>[v.name,v]));
     groups.forEach(r=>{
       const v=byName.get(r.userData.name);
       if(v){r.position.x=v.x;r.position.z=v.z;r.rotation.y=v.rotationY||0;r.userData.level=v.level||r.userData.level;syncEquipmentSprite(r);}
     });
     savePositions();toast('版位已匯入');
   }catch(err){toast('匯入檔案格式不正確');}
 };
 reader.readAsText(file);
}
function snapValue(v){return snap?Math.round(v/5)*5:v;}

renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.pointerType!=='mouse' && e.isPrimary===false)return;
 if(!edit)return;
 const r=hitEquipment(e);
 if(!r)return;

 controls.enabled=false;
 if(drag){drag=null;}
 if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
 activePointerId=e.pointerId;
 try{renderer.domElement.setPointerCapture?.(e.pointerId);}catch(err){}
 drag={root:r,longPressed:false,moved:false,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY};

 if(e.pointerType==='mouse'){
   drag.longPressed=true;
   renderer.domElement.style.cursor='grabbing';
 }else{
   pressTimer=setTimeout(()=>{
     if(!drag||drag.pointerId!==e.pointerId)return;
     drag.longPressed=true;
     renderer.domElement.style.cursor='grabbing';
     toast('拖曳中：移動到你要的位置');
   },380);
 }
},true);

renderer.domElement.addEventListener('pointermove',e=>{
 if(!drag||drag.pointerId!==e.pointerId)return;

 if(!drag.longPressed){
   const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;
   if(Math.hypot(dx,dy)>10){
     if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
     const id=drag.pointerId;
     drag=null;
     activePointerId=null;
     controls.enabled=true;
     try{renderer.domElement.releasePointerCapture?.(id);}catch(err){}
     return;
   }
   return;
 }

 const world=groundPoint(e,drag.root.position.y);
 if(!world)return;
 drag.root.position.x=snapValue(world.x);
 drag.root.position.z=snapValue(world.z);
 drag.moved=true;
});
function finishPointer(e, cancelled=false){
 if(!drag)return;
 if(drag.pointerId!==e.pointerId && !cancelled)return;
 if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
 const r=drag.root;const wasDrag=!cancelled&&drag.longPressed&&drag.moved;
 try{if(renderer.domElement.hasPointerCapture?.(e.pointerId))renderer.domElement.releasePointerCapture(e.pointerId);}catch(err){}
 drag=null;activePointerId=null;controls.enabled=true;renderer.domElement.style.cursor='';
 if(!cancelled){if(!wasDrag)select(r);else{savePositions();toast('位置已更新');}}
}
renderer.domElement.addEventListener('pointerup',e=>finishPointer(e,false));
renderer.domElement.addEventListener('pointercancel',e=>finishPointer(e,true));
renderer.domElement.addEventListener('lostpointercapture',e=>{if(drag&&drag.pointerId===e.pointerId)finishPointer(e,true);});
