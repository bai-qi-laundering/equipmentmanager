    transparent:opacity<1,opacity,depthWrite:opacity>=1

}
function box(w,h,d,c,opacity=1){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c,.55,.35,opacity));

}

 else if(type==='vertical'){const w=5,d=5;g.add(rbox(w,7.8,d,0xd5dde2,.82,.22));panelBox(g,4.1,.55,.25,0x347da6,0,3.55,-d/2-.12,.92);panelBox(g,1.35,.42,.16,0x10263a,-1.15,3.92,-d/2-.25,.96);washerDoor(g,1.48,d/2+.12);panelBox(g,3.8,.22,3.6,0x9aa8b0,0,-3.85,0,.7);}

function setSyncBadge(text,ok=false){

async function loadRemoteLayout(){
 try{
  setSyncBadge('連線中');const res=await fetch(API_BASE+'/api/layout',{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);
  const payload=await res.json();const positions=Array.isArray(payload.positions)?payload.positions:[];
  if(positions.length){const byId=new Map(positions.map(v=>[v.id,v]));const byName=new Map(positions.map(v=>[v.name,v]));
   groups.forEach(r=>{const v=byId.get(r.userData.id)||byName.get(r.userData.name);if(v){if(typeof v.x==='number')r.position.x=v.x;if(typeof v.z==='number')r.position.z=v.z;if(typeof v.rotation_y==='number')r.rotation.y=v.rotation_y;else if(typeof v.rotationY==='number')r.rotation.y=v.rotationY;if(r.userData.kind==='icc'&&Math.abs(r.rotation.y)<.001)r.rotation.y=Math.PI/2;if(v.status!=null)r.userData.status=v.status;if(v.cleaning_last_date!=null)r.userData.cleaningLastDate=String(v.cleaning_last_date).slice(0,10);if(v.cleaning_cycle_days!=null)r.userData.cleaningCycleDays=Number(v.cleaning_cycle_days);if(v.maintenance_last_date!=null)r.userData.maintenanceLastDate=String(v.maintenance_last_date).slice(0,10);if(v.maintenance_cycle_days!=null)r.userData.maintenanceCycleDays=Number(v.maintenance_cycle_days);if(v.notes!=null)r.userData.notes=v.notes;}});
   localStorage.setItem(SYNC_KEY,JSON.stringify(getPositionData()));
  }
  apiAvailable=true;setSyncBadge('NAS 已連線',true);return true;
 }catch(err){apiAvailable=false;setSyncBadge('NAS 暫離線');return false;}
}
async function saveRemoteLayout(){
 if(syncing||!apiAvailable)return false;
 syncing=true;
 try{
  const res=await fetch(API_BASE+'/api/layout',{
   method:'PUT',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({positions:getPositionData()})
  });
  if(!res.ok)throw new Error('HTTP '+res.status);
  setSyncBadge('NAS 已同步',true); return true;
 }catch(err){apiAvailable=false;setSyncBadge('本機暫存');return false;}
 finally{syncing=false;}
}

 root.userData={name,type,kind,id,status:'正常',cleaningLastDate:'',cleaningCycleDays:30,maintenanceLastDate:'',maintenanceCycleDays:180,notes:''};
 const m=model(kind);m.position.y=1.5;root.add(m);if(kind==='icc')root.rotation.y=Math.PI/2;

 const plateW=(kind==='icc'||kind==='longPress')?17:kind==='crane'?5:kind==='fan'?7:kind==='office'?13:8;
 const plateD=(kind==='icc'||kind==='longPress')?7:kind==='crane'?5:kind==='fan'?7:kind==='office'?10:8;
 const plateColor=type==='洗衣設備'?0x0877d1:type==='烘乾設備'?0x1bd58d:type==='燙床設備'?0x9b63ff:kind==='fan'?0xf18cb9:0x2a79b9;
 const plate=glowPlate(plateW,plateD,plateColor);
 plate.position.y=.05;root.add(plate);

 const color=type==='燙床設備'?'#a76cff':type==='烘乾設備'?'#46e0a6':kind==='fan'?'#ff9ac8':'#35b8ff';
 const l=label(name,color);l.position.set(0,7,0);root.add(l);

 root.position.set(x,0,z);scene.add(root);groups.set(root.userData.id,root);
 root.traverse(o=>{if(o.isMesh){o.userData.root=root;o.userData.interactive=true;}});
 return root;
}
instances.forEach(v=>addEquipment(...v));
restoreSavedPositions();
setTimeout(()=>loadRemoteLayout(),0);

function addPalette(){
 const wrap=document.getElementById('items');wrap.innerHTML='';
 palette.forEach(([n,t,k,ic])=>{const b=document.createElement('button');b.className='item';b.dataset.kind=k;b.dataset.type=t;b.innerHTML=`<div class="thumb">${ic}</div><span>${n}</span>`;b.onclick=()=>{if(!edit){toast('目前是巡檢模式，請先切換到編輯模式');return;}const r=addEquipment(n,t,k,controls.target.x,controls.target.z);savePositions();toast('已加入地圖，可直接拖曳');};wrap.appendChild(b)});
}
addPalette();

const ray=new THREE.Raycaster();
function pointerNDC(e){
 const r=renderer.domElement.getBoundingClientRect();
 return {x:((e.clientX-r.left)/r.width)*2-1,y:-((e.clientY-r.top)/r.height)*2+1};
}
function hitEquipment(e){
 const p=pointerNDC(e);
 ray.setFromCamera(new THREE.Vector2(p.x,p.y),camera);
 const hits=ray.intersectObjects(scene.children,true);
 for(const h of hits){
   let o=h.object;
   while(o){
     if(o.userData?.interactive && o.userData?.root) return o.userData.root;
     o=o.parent;
   }
 }
 return null;
}
function groundPoint(e){
 const p=pointerNDC(e);
 ray.setFromCamera(new THREE.Vector2(p.x,p.y),camera);
 const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),out=new THREE.Vector3();
 return ray.ray.intersectPlane(plane,out)?out:null;
}
function select(root){selected=root;if(root)openPanel(root);}
function setPanelEditable(canEdit){['eqName','eqStatus','eqCleaningDate','eqCleaningCycle','eqMaintenanceDate','eqMaintenanceCycle','eqNotes','saveEqBtn','rotateLeftBtn','rotateRightBtn','resetRotationBtn'].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=!canEdit;});}
function openPanel(r){document.getElementById('pn').textContent=r.userData.name;document.getElementById('pt').textContent=r.userData.type;document.getElementById('eqName').value=r.userData.name||'';document.getElementById('eqStatus').value=r.userData.status||'正常';document.getElementById('eqCleaningDate').value=r.userData.cleaningLastDate||'';document.getElementById('eqCleaningCycle').value=Number(r.userData.cleaningCycleDays||30);document.getElementById('eqMaintenanceDate').value=r.userData.maintenanceLastDate||'';document.getElementById('eqMaintenanceCycle').value=Number(r.userData.maintenanceCycleDays||180);document.getElementById('eqNotes').value=r.userData.notes||'';document.getElementById('eqId').textContent=r.userData.id||'—';document.getElementById('eqKind').textContent=r.userData.kind||'—';setPanelEditable(edit);document.getElementById('panel').classList.add('open');}
function closePanel(){document.getElementById('panel').classList.remove('open');}
function toast(s){
 const t=document.getElementById('toast');
 t.textContent=s;t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),1500);
}
function getPositionData(){
 return [...groups.values()].map(r=>({id:r.userData.id,name:r.userData.name,type:r.userData.type,kind:r.userData.kind,x:r.position.x,z:r.position.z,rotationY:r.rotation.y,status:r.userData.status||'正常',cleaningLastDate:r.userData.cleaningLastDate||'',cleaningCycleDays:Number(r.userData.cleaningCycleDays||30),maintenanceLastDate:r.userData.maintenanceLastDate||'',maintenanceCycleDays:Number(r.userData.maintenanceCycleDays||180),notes:r.userData.notes||''}));
}
function savePositions(){
 const data=JSON.stringify(getPositionData());
 localStorage.setItem(SYNC_KEY,data);
 try{
  const req=indexedDB.open('factory3d-db',1);
  req.onupgradeneeded=()=>req.result.createObjectStore('layout');
  req.onsuccess=()=>{
   const db=req.result;
   const tx=db.transaction('layout','readwrite');
   tx.objectStore('layout').put({id:'current',data});
  };
 }catch(err){}
 void saveRemoteLayout();
}
function restoreSavedPositions(){
 try{
   const raw=localStorage.getItem('factory3dPositions');
   if(!raw)return false;
   const saved=JSON.parse(raw);
   const byId=new Map(saved.map(v=>[v.id,v]));
   groups.forEach(r=>{
     const v=byId.get(r.userData.id);
     if(v){r.position.x=v.x;r.position.z=v.z;r.rotation.y=typeof v.rotationY==='number'?v.rotationY:0;if(r.userData.kind==='icc'&&Math.abs(r.rotation.y)<.001)r.rotation.y=Math.PI/2;Object.assign(r.userData,{name:v.name||r.userData.name,status:v.status||r.userData.status,cleaningLastDate:v.cleaningLastDate||'',cleaningCycleDays:Number(v.cleaningCycleDays||r.userData.cleaningCycleDays),maintenanceLastDate:v.maintenanceLastDate||'',maintenanceCycleDays:Number(v.maintenanceCycleDays||r.userData.maintenanceCycleDays),notes:v.notes||''});}
   });
   return true;
 }catch(err){return false;}
}
function exportLayout(){
 const blob=new Blob([JSON.stringify({version:1,savedAt:new Date().toISOString(),positions:getPositionData()},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='factory-layout.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importLayout(file){
 const reader=new FileReader();
 reader.onload=()=>{
   try{
     const saved=JSON.parse(reader.result);
     const list=saved.positions||saved;
     const byName=new Map(list.map(v=>[v.name,v]));
     groups.forEach(r=>{
       const v=byName.get(r.userData.name);
       if(v){r.position.x=v.x;r.position.z=v.z;r.rotation.y=v.rotationY||0;}
     });
     savePositions();toast('版位已匯入');
   }catch(err){toast('匯入檔案格式不正確');}
 };
 reader.readAsText(file);
}
function snapValue(v){return snap?Math.round(v/5)*5:v;}

renderer.domElement.addEventListener('pointerdown',e=>{
 if(!edit||activePointerId!==null)return;
 const r=hitEquipment(e);
 if(!r)return;

 activePointerId=e.pointerId;
 renderer.domElement.setPointerCapture?.(e.pointerId);

 drag={root:r,longPressed:false,moved:false,startX:e.clientX,startY:e.clientY};

 // 電腦：按下就可以拖；手機／平板：先短按看資料，長按進入拖曳。
 if(e.pointerType==='mouse'){
   drag.longPressed=true;
   controls.enabled=false;
   renderer.domElement.style.cursor='grabbing';
 }else{
   pressTimer=setTimeout(()=>{
     if(!drag)return;
     drag.longPressed=true;
     controls.enabled=false;
     renderer.domElement.style.cursor='grabbing';
     toast('拖曳中：移動到你要的位置');
   },380);
 }
});

renderer.domElement.addEventListener('pointermove',e=>{
 if(!drag)return;

 // 滑鼠：按住就拖。觸控：長按後才拖。
 if(!drag.longPressed)return;

 const world=groundPoint(e);
 if(!world)return;

 drag.root.position.x=snapValue(world.x);
 drag.root.position.z=snapValue(world.z);
 drag.moved=true;
});

renderer.domElement.addEventListener('pointerup',e=>{
 if(!drag)return;

 if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}

 const r=drag.root;
 const wasDrag=drag.longPressed && drag.moved;

 drag=null;
 controls.enabled=true;
 renderer.domElement.style.cursor='';

 if(!wasDrag){
   select(r);
 }else{
   savePositions();
   toast('位置已更新');
 }

 activePointerId=null;
});

renderer.domElement.addEventListener('pointercancel',()=>{
 if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
 drag=null;
 controls.enabled=true;
 activePointerId=null;
 renderer.domElement.style.cursor='';
});

document.getElementById('saveEqBtn').onclick=async()=>{if(!selected)return;selected.userData.name=document.getElementById('eqName').value.trim()||selected.userData.name;selected.userData.status=document.getElementById('eqStatus').value;selected.userData.cleaningLastDate=document.getElementById('eqCleaningDate').value;selected.userData.cleaningCycleDays=Math.max(0,Number(document.getElementById('eqCleaningCycle').value||0));selected.userData.maintenanceLastDate=document.getElementById('eqMaintenanceDate').value;selected.userData.maintenanceCycleDays=Math.max(0,Number(document.getElementById('eqMaintenanceCycle').value||0));selected.userData.notes=document.getElementById('eqNotes').value;const lbl=selected.children.find(o=>o.isCSS2DObject);if(lbl)lbl.element.textContent=selected.userData.name;document.getElementById('pn').textContent=selected.userData.name;savePositions();if(apiAvailable)await saveRemoteLayout();toast('設備資料已同步至 NAS');};
document.getElementById('rotateLeftBtn').onclick=()=>{if(!selected||!edit)return;selected.rotation.y-=Math.PI/2;savePositions();toast('設備已左轉 90°');};
document.getElementById('rotateRightBtn').onclick=()=>{if(!selected||!edit)return;selected.rotation.y+=Math.PI/2;savePositions();toast('設備已右轉 90°');};
document.getElementById('resetRotationBtn').onclick=()=>{if(!selected||!edit)return;selected.rotation.y=0;savePositions();toast('設備方向已重設');};
document.getElementById('close').onclick=closePanel;
document.getElementById('editBtn').onclick=()=>{
 edit=true;closePanel();setPanelEditable(true);
 document.getElementById('editBtn').classList.add('active');
 document.getElementById('viewBtn').classList.remove('active');
 document.getElementById('hint').textContent='編輯模式：短點查看；長按設備約 0.4 秒後拖曳；雙指操作地圖';
};
document.getElementById('viewBtn').onclick=()=>{
 edit=false;closePanel();setPanelEditable(false);
 document.getElementById('viewBtn').classList.add('active');
 document.getElementById('editBtn').classList.remove('active');
 document.getElementById('hint').textContent='巡檢模式：點設備查看清潔、保養、維修資料';
};
document.getElementById('resetBtn').onclick=()=>{
 camera.position.set(0,70,105);controls.target.set(0,0,0);controls.update();
};
document.getElementById('snapBtn').onclick=()=>{
 snap=!snap;
 document.getElementById('snapBtn').textContent=`吸附：${snap?'開':'關'}`;
};
document.getElementById('saveBtn').onclick=async()=>{
 savePositions();
 if(!apiAvailable)await loadRemoteLayout();
 if(apiAvailable)await saveRemoteLayout();
 toast(apiAvailable?'已同步至 NAS':'已儲存到本機，NAS 暫時離線');
};
document.getElementById('exportBtn').onclick=exportLayout;
document.getElementById('importInput').onchange=e=>{if(e.target.files[0])importLayout(e.target.files[0]);};
document.getElementById('search').oninput=e=>{
 const q=e.target.value.trim().toLowerCase();
 groups.forEach(r=>r.visible=!q||r.userData.name.toLowerCase().includes(q));
};
document.getElementById('filter').onchange=e=>{
 const f=e.target.value;
 groups.forEach(r=>r.visible=f==='全部設備'||r.userData.type===f);
};
setInterval(()=>{if(!apiAvailable&&!syncing)loadRemoteLayout();},15000);
function resize(){
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);labels.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);
function animate(){
 requestAnimationFrame(animate);controls.update();
 renderer.render(scene,camera);labels.render(scene,camera);
}
animate();
