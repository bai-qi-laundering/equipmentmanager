<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>洗滌廠 3D 設備地圖</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
#app{position:fixed;inset:0}#canvas{position:absolute;inset:0;touch-action:none}
.top{position:fixed;z-index:10;left:16px;right:16px;top:14px;height:60px;display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #1d6ca8;border-radius:16px;background:rgba(5,20,38,.86);backdrop-filter:blur(14px)}
.logo{font-size:20px;font-weight:900;white-space:nowrap}.mode{margin-left:auto;display:flex;gap:7px;align-items:center}
button,select,input{font:inherit;color:#fff;border:1px solid #245b88;background:#0a2744;border-radius:10px;padding:9px 12px}
button{cursor:pointer}button.active{background:#087bc2;border-color:#36b9ff}.search{width:240px}
.side{position:fixed;z-index:10;left:14px;top:88px;bottom:170px;width:74px;display:flex;flex-direction:column;gap:7px;padding:9px;border:1px solid #184d78;border-radius:18px;background:rgba(5,20,38,.8);backdrop-filter:blur(14px)}
.side button{padding:12px 4px;font-size:12px}.side button:first-child{background:#0a78bd}
.palette{position:fixed;z-index:12;left:0;right:0;bottom:0;height:158px;padding:10px 18px 14px;border-top:1px solid #1d6ca8;background:rgba(4,17,32,.95);backdrop-filter:blur(18px);overflow-x:auto}
.palette h3{margin:0 0 7px;font-size:14px;color:#9edcff}.items{display:flex;gap:10px;min-width:max-content}
.item{width:118px;height:105px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #245b88;border-radius:14px;background:#0a2038}.item:active{transform:scale(.97)}
.thumb{width:70px;height:58px;display:flex;align-items:center;justify-content:center;font-size:40px}.item span{font-size:13px;font-weight:800}
.panel{position:fixed;z-index:20;right:0;top:0;width:min(380px,92vw);height:100%;padding:24px;background:rgba(5,19,35,.96);border-left:1px solid #205d8e;transform:translateX(100%);transition:.22s;overflow:auto}.panel.open{transform:none}
.close{position:absolute;right:14px;top:14px;border-radius:50%;width:40px;height:40px;padding:0;font-size:22px}
.panel h2{margin:58px 0 4px}.muted{color:#91abc2}.card{margin-top:16px;padding:14px;border:1px solid #1b496e;border-radius:14px;background:#0a2037}.row{display:flex;justify-content:space-between;margin:10px 0}.ok{color:#55e5bd}.warn{color:#ffd166}
.hint{position:fixed;z-index:11;left:50%;top:82px;transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:rgba(5,20,38,.72);color:#a9c9df;font-size:12px;pointer-events:none}
#toast{position:fixed;z-index:50;left:50%;bottom:174px;transform:translate(-50%,20px);opacity:0;padding:10px 15px;border-radius:12px;background:#0c2b48;border:1px solid #2d83bc;transition:.2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"><div id="canvas"></div>
<div class="top">
  <div class="logo">▱ 洗滌廠 3D 設備地圖</div>
  <select id="filter"><option>全部設備</option><option>洗衣設備</option><option>烘乾設備</option><option>燙床設備</option><option>整燙設備</option><option>周邊設備</option></select>
  <input class="search" id="search" placeholder="搜尋設備名稱…">
  <div class="mode"><button id="editBtn" class="active">編輯模式</button><button id="viewBtn">巡檢模式</button><button id="resetBtn">重置視角</button></div>
</div>
<div class="hint" id="hint">編輯模式：短點查看；長按設備約 0.4 秒後拖曳；雙指操作地圖</div>
<div class="side"><button>▧<br>地圖</button><button>⚙<br>設備</button><button>✓<br>清潔</button><button>◷<br>保養</button><button>⚒<br>維修</button></div>
<div class="palette"><h3>設備庫　（點一下加入地圖，再長按拖曳到想要的位置）</h3><div class="items" id="items"></div></div><div style="position:fixed;z-index:19;right:18px;bottom:170px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button id="snapBtn">吸附：開</button><button id="saveBtn">💾 儲存</button><button id="exportBtn">⬇️ 匯出版位</button><label style="padding:9px 12px;border:1px solid #245b88;background:#0a2744;border-radius:10px;cursor:pointer">⬆️ 匯入版位<input id="importInput" type="file" accept="application/json" style="display:none"></label></div>
<div class="panel" id="panel"><button class="close" id="close">×</button><h2 id="pn">設備</h2><div class="muted" id="pt">設備</div><div class="card">
<div class="row"><span>狀態</span><b class="ok">正常</b></div><div class="row"><span>上次清潔</span><b>尚未建立</b></div><div class="row"><span>清潔週期</span><b>30 天</b></div><div class="row"><span>上次保養</span><b>尚未建立</b></div><div class="row"><span>保養週期</span><b>180 天</b></div><div class="row"><span>維修紀錄</span><b>0 筆</b></div>
</div><div class="card"><button style="width:100%;margin:4px 0">＋ 新增清潔紀錄</button><button style="width:100%;margin:4px 0">＋ 新增保養紀錄</button><button style="width:100%;margin:4px 0">＋ 新增維修紀錄</button></div>
</div><div id="toast"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer,CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';

const app=document.getElementById('canvas'), scene=new THREE.Scene();
scene.background=new THREE.Color(0x061321);
scene.fog=new THREE.Fog(0x061321,80,260);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);
camera.position.set(0,70,105);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;app.appendChild(renderer.domElement);
const labels=new CSS2DRenderer();labels.setSize(innerWidth,innerHeight);labels.domElement.style.position='absolute';labels.domElement.style.inset='0';labels.domElement.style.pointerEvents='none';app.appendChild(labels.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.enablePan=true;controls.maxPolarAngle=Math.PI*.49;controls.minDistance=20;controls.maxDistance=240;controls.target.set(0,0,0);

scene.add(new THREE.HemisphereLight(0xbfe8ff,0x13243b,2.2));
const key=new THREE.DirectionalLight(0xffffff,2.5);key.position.set(30,70,40);key.castShadow=true;scene.add(key);
const fill=new THREE.PointLight(0x26a9ff,80,180);fill.position.set(-45,35,25);scene.add(fill);
const grid=new THREE.GridHelper(180,36,0x15547a,0x0b2d46);grid.position.y=-1;scene.add(grid);

const palette=[
 ['30K','洗衣設備','washer','🧺'],['60K','洗衣設備','washer','🧺'],['80K','洗衣設備','washer','🧺'],
 ['35kg','洗衣設備','washer','🧺'],['50kg','洗衣設備','washer','🧺'],['直式洗衣機','洗衣設備','vertical','🧺'],
 ['烘乾機','烘乾設備','dryer','◉'],['N5','燙床設備','press','▤'],['IRT','燙床設備','press','▤'],
 ['襯衫機','整燙設備','shirt','▣'],['平燙機','整燙設備','flat','▤'],['ICC','整燙設備','icc','▰'],['天車','周邊設備','crane','⚙']
];
const instances=[
 // 倉庫1：左側 30K / 60K / 80K 縱向
 ['30K','洗衣設備','washer',-58,-28],
 ['60K','洗衣設備','washer',-58,-10],
 ['80K','洗衣設備','washer',-58,8],

 // 左上 L 型桌；中央整燙區；左下 ICC
 ['L型桌','周邊設備','office',-58,-48],
 ['襯衫機','整燙設備','shirt',-18,-20],
 ['平燙機','整燙設備','longPress',-18,0],
 ['整燙區','整燙設備','longPress',-18,20],
 ['ICC','整燙設備','icc',-38,36],

 // 倉庫2：上方 35kg / 50kg、小型洗衣機區；中間辦公室與直式洗衣機
 ['35kg','洗衣設備','washer',34,-44],
 ['50kg','洗衣設備','washer',50,-44],
 ['兩層辦公室','周邊設備','office',45,-10],
 ['直式洗衣機 #01','洗衣設備','vertical',72,-12],
 ['直式洗衣機 #02','洗衣設備','vertical',72,2],
 ['直式洗衣機 #03','洗衣設備','vertical',72,16],

 // 辦公室左側 N5 / IRT；下方 3 台烘乾機
 ['N5','燙床設備','longPress',30,10],
 ['IRT','燙床設備','longPress',58,10],
 ['烘乾機 #01','烘乾設備','dryer',18,43],
 ['烘乾機 #02','烘乾設備','dryer',32,43],
 ['烘乾機 #03','烘乾設備','dryer',46,43],

 // 兩台天車 + 冷風區
 ['天車 #01','周邊設備','crane',-26,-4],
 ['天車 #02','周邊設備','crane',22,5],
 ['冷風區','周邊設備','fan',-2,42]
];
const groups=new Map();let selected=null;let edit=true;let snap=true;let uid=0;let pressTimer=null;let activePointerId=null;let drag=null;

function mat(c,rough=.55,metal=.35){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal});}
function box(w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.castShadow=true;m.receiveShadow=true;return m;}
function label(text,color='#8bd8ff'){const el=document.createElement('div');el.textContent=text;el.style.cssText=`padding:5px 9px;border:1px solid ${color};border-radius:9px;background:rgba(4,20,36,.88);color:#fff;font-weight:800;font-size:12px;white-space:nowrap;box-shadow:0 0 14px ${color}66`;return new CSS2DObject(el);}
function model(type){
 const g=new THREE.Group();

 if(type==='washer'||type==='vertical'){
   const w=type==='vertical'?4.6:6.4,d=type==='vertical'?4.6:6;
   g.add(box(w,5.2,d,0xcbd6df));
   const ring=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.35,.38,32),mat(0x12263b,.23,.65));
   ring.rotation.x=Math.PI/2;ring.position.set(0,.15,d/2+.03);g.add(ring);
   const top=box(w*.82,.38,d*.84,0x1f82cf);top.position.y=2.7;g.add(top);
 }else if(type==='dryer'){
   g.add(box(6.4,5.2,5.4,0xd7dee5));
   const drum=new THREE.Mesh(new THREE.CylinderGeometry(1.42,1.42,.32,32),mat(0x101d2d,.2,.65));
   drum.rotation.x=Math.PI/2;drum.position.z=2.73;g.add(drum);
 }else if(type==='longPress'){
   // ICC / IRT / N5: intentionally long, approximately 3 grid cells.
   g.add(box(5.5,2.4,24,0xd5dfe6));
   const p1=box(3.4,4.3,3.2,0x2a75aa);p1.position.set(0,2.8,-8);g.add(p1);
   const p2=box(3.4,4.3,3.2,0x2a75aa);p2.position.set(0,2.8,0);g.add(p2);
   const p3=box(3.4,4.3,3.2,0x2a75aa);p3.position.set(0,2.8,8);g.add(p3);
   const belt=box(4.5,.5,21,0x91a9bb);belt.position.y=1.4;g.add(belt);
 }else if(type==='shirt'){
   g.add(box(5.4,5.1,8.2,0xb8c7d4));
   const mast=box(2.1,7,2.1,0x246eaa);mast.position.y=5.2;g.add(mast);
 }else if(type==='icc'){
   // kept for backwards compatibility; long industrial body
   g.add(box(5.5,2.4,24,0xc8d5df));
   g.add(box(4.6,1.6,21,0x2d76aa)).position.y=2.4;
 }else if(type==='crane'){
   // overhead crane like the reference photo: orange hoist trolley + hook under a steel beam
   const beam=box(3,1.2,24,0x6f7882);g.add(beam);
   const rail=box(3.6,.35,22,0xa8b0b8);rail.position.y=.35;g.add(rail);
   const trolley=box(3.2,1.7,4.2,0xf06f2f);trolley.position.set(0,-1.1,-2);g.add(trolley);
   const motor=box(2.1,1.3,2.2,0xd98325);motor.position.set(0,-2.5,-2);g.add(motor);
   const cable=box(.18,5.8,.18,0x20252b);cable.position.set(0,-5.1,-2);g.add(cable);
   const hook=new THREE.TorusGeometry(.7,.14,12,24,Math.PI*1.6);
   const hm=new THREE.Mesh(hook,mat(0xd98923,.45,.65));hm.rotation.x=Math.PI/2;hm.position.set(0,-8,-2);g.add(hm);
 }else if(type==='office'){
   const base=box(11,3.2,8.5,0xcaa878);base.position.y=1.6;g.add(base);
   const floor=box(10.2,2.3,7.7,0xf0dfbf);floor.position.y=4.1;g.add(floor);
   for(let i=-1;i<=1;i++){const desk=box(2.5,.7,1.6,0x674c39);desk.position.set(i*3,5.6,0);g.add(desk);}
 }else if(type==='fan'){
   const stand=box(2.2,1.3,2.2,0x74818e);stand.position.y=.65;g.add(stand);
   const mast=box(.5,3,.5,0x7f8c99);mast.position.y=2.2;g.add(mast);
   const hub=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,.7,32),mat(0x7c8996,.35,.5));hub.rotation.x=Math.PI/2;hub.position.y=3.7;g.add(hub);
   for(let i=0;i<5;i++){const blade=box(.32,.25,3.8,0xd5dde4);blade.position.set(0,3.7,1.8);blade.rotation.y=i*Math.PI*2/5;g.add(blade);}
 }else{
   g.add(box(5,4,5,0x93a6b5));
 }
 return g;
}
function addEquipment(name,type,kind,x,z){
 const root=new THREE.Group();
 root.userData={name,type,kind,id:`EQ-${++uid}`};
 const m=model(kind);m.position.y=1.5;root.add(m);

 const plateW=(kind==='icc'||kind==='longPress')?7:kind==='crane'?4:kind==='fan'?7:kind==='office'?13:8;
 const plateD=(kind==='icc'||kind==='longPress')?26:kind==='crane'?24:kind==='fan'?7:kind==='office'?10:8;
 const plateColor=type==='洗衣設備'?0x0877d1:type==='烘乾設備'?0x1bd58d:type==='燙床設備'?0x9b63ff:kind==='fan'?0xf18cb9:0x2a79b9;
 const plate=box(plateW,.18,plateD,plateColor);
 plate.position.y=.05;root.add(plate);

 const color=type==='燙床設備'?'#a76cff':type==='烘乾設備'?'#46e0a6':kind==='fan'?'#ff9ac8':'#35b8ff';
 const l=label(name,color);l.position.set(0,7,0);root.add(l);

 root.position.set(x,0,z);scene.add(root);groups.set(root.userData.id,root);
 root.traverse(o=>{if(o.isMesh){o.userData.root=root;o.userData.interactive=true;}});
 return root;
}
instances.forEach(v=>addEquipment(...v));
restoreSavedPositions();

function addPalette(){
 const wrap=document.getElementById('items');wrap.innerHTML='';
 palette.forEach(([n,t,k,ic])=>{const b=document.createElement('button');b.className='item';b.dataset.kind=k;b.dataset.type=t;b.innerHTML=`<div class="thumb">${ic}</div><span>${n}</span>`;b.onclick=()=>{if(!edit){toast('目前是巡檢模式，請先切換到編輯模式');return;}const r=addEquipment(n,t,k,controls.target.x,controls.target.z);savePositions();toast('已加入地圖，可直接拖曳');};wrap.appendChild(b)});
}
addPalette();

const ray=new THREE.Raycaster();
function pointerNDC(e){
 const r=renderer.domElement.getBoundingClientRect();
 return {x:((e.clientX-r.left)/r.width)*2-1,y:-((e.clientY-r.top)/r.height)*2+1};
}
function hitEquipment(e){
 const p=pointerNDC(e);
 ray.setFromCamera(new THREE.Vector2(p.x,p.y),camera);
 const hits=ray.intersectObjects(scene.children,true);
 for(const h of hits){
   let o=h.object;
   while(o){
     if(o.userData?.interactive && o.userData?.root) return o.userData.root;
     o=o.parent;
   }
 }
 return null;
}
function groundPoint(e){
 const p=pointerNDC(e);
 ray.setFromCamera(new THREE.Vector2(p.x,p.y),camera);
 const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),out=new THREE.Vector3();
 return ray.ray.intersectPlane(plane,out)?out:null;
}
function select(root){selected=root;if(root)openPanel(root);}
function openPanel(r){
 document.getElementById('pn').textContent=r.userData.name;
 document.getElementById('pt').textContent=r.userData.type;
 document.getElementById('panel').classList.add('open');
}
function closePanel(){document.getElementById('panel').classList.remove('open');}
function toast(s){
 const t=document.getElementById('toast');
 t.textContent=s;t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),1500);
}
function getPositionData(){
 return [...groups.values()].map(r=>({
   id:r.userData.id,name:r.userData.name,type:r.userData.type,kind:r.userData.kind,
   x:r.position.x,z:r.position.z,rotationY:r.rotation.y
 }));
}
function savePositions(){
 const data=JSON.stringify(getPositionData());
 localStorage.setItem('factory3dPositions',data);
 try{
   const req=indexedDB.open('factory3d-db',1);
   req.onupgradeneeded=()=>req.result.createObjectStore('layout');
   req.onsuccess=()=>{
     const db=req.result;
     const tx=db.transaction('layout','readwrite');
     tx.objectStore('layout').put({id:'current',data});
   };
 }catch(err){}
}
function restoreSavedPositions(){
 try{
   const raw=localStorage.getItem('factory3dPositions');
   if(!raw)return false;
   const saved=JSON.parse(raw);
   const byId=new Map(saved.map(v=>[v.id,v]));
   groups.forEach(r=>{
     const v=byId.get(r.userData.id);
     if(v){r.position.x=v.x;r.position.z=v.z;r.rotation.y=v.rotationY||0;}
   });
   return true;
 }catch(err){return false;}
}
function exportLayout(){
 const blob=new Blob([JSON.stringify({version:1,savedAt:new Date().toISOString(),positions:getPositionData()},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='factory-layout.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importLayout(file){
 const reader=new FileReader();
 reader.onload=()=>{
   try{
     const saved=JSON.parse(reader.result);
     const list=saved.positions||saved;
     const byName=new Map(list.map(v=>[v.name,v]));
     groups.forEach(r=>{
       const v=byName.get(r.userData.name);
       if(v){r.position.x=v.x;r.position.z=v.z;r.rotation.y=v.rotationY||0;}
     });
     savePositions();toast('版位已匯入');
   }catch(err){toast('匯入檔案格式不正確');}
 };
 reader.readAsText(file);
}
function snapValue(v){return snap?Math.round(v/2)*2:v;}

renderer.domElement.addEventListener('pointerdown',e=>{
 if(!edit||activePointerId!==null)return;
 const r=hitEquipment(e);
 if(!r)return;

 activePointerId=e.pointerId;
 renderer.domElement.setPointerCapture?.(e.pointerId);

 drag={root:r,longPressed:false,moved:false,startX:e.clientX,startY:e.clientY};

 // 電腦：按下就可以拖；手機／平板：先短按看資料，長按進入拖曳。
 if(e.pointerType==='mouse'){
   drag.longPressed=true;
   controls.enabled=false;
   renderer.domElement.style.cursor='grabbing';
 }else{
   pressTimer=setTimeout(()=>{
     if(!drag)return;
     drag.longPressed=true;
     controls.enabled=false;
     renderer.domElement.style.cursor='grabbing';
     toast('拖曳中：移動到你要的位置');
   },380);
 }
});

renderer.domElement.addEventListener('pointermove',e=>{
 if(!drag)return;

 // 滑鼠：按住就拖。觸控：長按後才拖。
 if(!drag.longPressed)return;

 const world=groundPoint(e);
 if(!world)return;

 drag.root.position.x=snapValue(world.x);
 drag.root.position.z=snapValue(world.z);
 drag.moved=true;
});

renderer.domElement.addEventListener('pointerup',e=>{
 if(!drag)return;

 if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}

 const r=drag.root;
 const wasDrag=drag.longPressed && drag.moved;

 drag=null;
 controls.enabled=true;
 renderer.domElement.style.cursor='';

 if(!wasDrag){
   select(r);
 }else{
   savePositions();
   toast('位置已更新');
 }

 activePointerId=null;
});

renderer.domElement.addEventListener('pointercancel',()=>{
 if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
 drag=null;
 controls.enabled=true;
 activePointerId=null;
 renderer.domElement.style.cursor='';
});

document.getElementById('close').onclick=closePanel;
document.getElementById('editBtn').onclick=()=>{
 edit=true;closePanel();
 document.getElementById('editBtn').classList.add('active');
 document.getElementById('viewBtn').classList.remove('active');
 document.getElementById('hint').textContent='編輯模式：短點查看；長按設備約 0.4 秒後拖曳；雙指操作地圖';
};
document.getElementById('viewBtn').onclick=()=>{
 edit=false;closePanel();
 document.getElementById('viewBtn').classList.add('active');
 document.getElementById('editBtn').classList.remove('active');
 document.getElementById('hint').textContent='巡檢模式：點設備查看清潔、保養、維修資料';
};
document.getElementById('resetBtn').onclick=()=>{
 camera.position.set(0,70,105);controls.target.set(0,0,0);controls.update();
};
document.getElementById('snapBtn').onclick=()=>{
 snap=!snap;
 document.getElementById('snapBtn').textContent=`吸附：${snap?'開':'關'}`;
};
document.getElementById('saveBtn').onclick=()=>{savePositions();toast('位置已儲存');};
document.getElementById('exportBtn').onclick=exportLayout;
document.getElementById('importInput').onchange=e=>{if(e.target.files[0])importLayout(e.target.files[0]);};
document.getElementById('search').oninput=e=>{
 const q=e.target.value.trim().toLowerCase();
 groups.forEach(r=>r.visible=!q||r.userData.name.toLowerCase().includes(q));
};
document.getElementById('filter').onchange=e=>{
 const f=e.target.value;
 groups.forEach(r=>r.visible=f==='全部設備'||r.userData.type===f);
};
function resize(){
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);labels.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);
function animate(){
 requestAnimationFrame(animate);controls.update();
 renderer.render(scene,camera);labels.render(scene,camera);
}
animate();
</script></div>
</body></html>
