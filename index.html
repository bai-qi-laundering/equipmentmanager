<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>洗滌廠 3D 設備地圖</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
#app{position:fixed;inset:0}#canvas{position:absolute;inset:0;touch-action:none}
.top{position:fixed;z-index:10;left:16px;right:16px;top:14px;height:60px;display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #1d6ca8;border-radius:16px;background:rgba(5,20,38,.86);backdrop-filter:blur(14px)}
.logo{font-size:20px;font-weight:900;white-space:nowrap}.mode{margin-left:auto;display:flex;gap:7px;align-items:center}
button,select,input{font:inherit;color:#fff;border:1px solid #245b88;background:#0a2744;border-radius:10px;padding:9px 12px}
button{cursor:pointer}button.active{background:#087bc2;border-color:#36b9ff}.search{width:240px}
.side{position:fixed;z-index:10;left:14px;top:88px;bottom:170px;width:74px;display:flex;flex-direction:column;gap:7px;padding:9px;border:1px solid #184d78;border-radius:18px;background:rgba(5,20,38,.8);backdrop-filter:blur(14px)}
.side button{padding:12px 4px;font-size:12px}.side button:first-child{background:#0a78bd}
.palette{position:fixed;z-index:12;left:0;right:0;bottom:0;height:158px;padding:10px 18px 14px;border-top:1px solid #1d6ca8;background:rgba(4,17,32,.95);backdrop-filter:blur(18px);overflow-x:auto}
.palette h3{margin:0 0 7px;font-size:14px;color:#9edcff}.items{display:flex;gap:10px;min-width:max-content}
.item{width:118px;height:105px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #245b88;border-radius:14px;background:#0a2038}.item:active{transform:scale(.97)}
.thumb{width:70px;height:58px;display:flex;align-items:center;justify-content:center;font-size:40px}.item span{font-size:13px;font-weight:800}
.panel{position:fixed;z-index:20;right:0;top:0;width:min(380px,92vw);height:100%;padding:24px;background:rgba(5,19,35,.96);border-left:1px solid #205d8e;transform:translateX(100%);transition:.22s;overflow:auto}.panel.open{transform:none}
.close{position:absolute;right:14px;top:14px;border-radius:50%;width:40px;height:40px;padding:0;font-size:22px}
.panel h2{margin:58px 0 4px}.muted{color:#91abc2}.card{margin-top:16px;padding:14px;border:1px solid #1b496e;border-radius:14px;background:#0a2037}.row{display:flex;justify-content:space-between;margin:10px 0}.ok{color:#55e5bd}.warn{color:#ffd166}
.hint{position:fixed;z-index:11;left:50%;top:82px;transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:rgba(5,20,38,.72);color:#a9c9df;font-size:12px;pointer-events:none}
#toast{position:fixed;z-index:50;left:50%;bottom:174px;transform:translate(-50%,20px);opacity:0;padding:10px 15px;border-radius:12px;background:#0c2b48;border:1px solid #2d83bc;transition:.2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"><div id="canvas"></div>
<div class="top">
  <div class="logo">▱ 洗滌廠 3D 設備地圖</div>
  <select id="filter"><option>全部設備</option><option>洗衣設備</option><option>烘乾設備</option><option>燙床設備</option><option>整燙設備</option></select>
  <input class="search" id="search" placeholder="搜尋設備名稱…">
  <div class="mode"><button id="editBtn" class="active">編輯模式</button><button id="viewBtn">巡檢模式</button><button id="resetBtn">重置視角</button></div>
</div>
<div class="hint" id="hint">編輯模式：點設備後可拖曳；雙指旋轉／縮放地圖</div>
<div class="side"><button>▧<br>地圖</button><button>⚙<br>設備</button><button>✓<br>清潔</button><button>◷<br>保養</button><button>⚒<br>維修</button></div>
<div class="palette"><h3>設備庫　（點一下加入地圖，再拖曳到想要的位置）</h3><div class="items" id="items"></div></div>
<div class="panel" id="panel"><button class="close" id="close">×</button><h2 id="pn">設備</h2><div class="muted" id="pt">設備</div><div class="card">
<div class="row"><span>狀態</span><b class="ok">正常</b></div><div class="row"><span>上次清潔</span><b>尚未建立</b></div><div class="row"><span>清潔週期</span><b>30 天</b></div><div class="row"><span>上次保養</span><b>尚未建立</b></div><div class="row"><span>保養週期</span><b>180 天</b></div><div class="row"><span>維修紀錄</span><b>0 筆</b></div>
</div><div class="card"><button style="width:100%;margin:4px 0">＋ 新增清潔紀錄</button><button style="width:100%;margin:4px 0">＋ 新增保養紀錄</button><button style="width:100%;margin:4px 0">＋ 新增維修紀錄</button></div>
</div><div id="toast"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer,CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';

const app=document.getElementById('canvas'), scene=new THREE.Scene();
scene.background=new THREE.Color(0x061321);
scene.fog=new THREE.Fog(0x061321,80,260);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);
camera.position.set(0,70,105);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;app.appendChild(renderer.domElement);
const labels=new CSS2DRenderer();labels.setSize(innerWidth,innerHeight);labels.domElement.style.position='absolute';labels.domElement.style.inset='0';labels.domElement.style.pointerEvents='none';app.appendChild(labels.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.enablePan=true;controls.maxPolarAngle=Math.PI*.49;controls.minDistance=20;controls.maxDistance=240;controls.target.set(0,0,0);

scene.add(new THREE.HemisphereLight(0xbfe8ff,0x13243b,2.2));
const key=new THREE.DirectionalLight(0xffffff,2.5);key.position.set(30,70,40);key.castShadow=true;scene.add(key);
const fill=new THREE.PointLight(0x26a9ff,80,180);fill.position.set(-45,35,25);scene.add(fill);
const grid=new THREE.GridHelper(180,36,0x15547a,0x0b2d46);grid.position.y=-1;scene.add(grid);

const palette=[
 ['30K','洗衣設備','washer','🧺'],['60K','洗衣設備','washer','🧺'],['80K','洗衣設備','washer','🧺'],
 ['35kg','洗衣設備','washer','🧺'],['50kg','洗衣設備','washer','🧺'],['直式洗衣機','洗衣設備','vertical','🧺'],
 ['烘乾機','烘乾設備','dryer','◉'],['N5','燙床設備','press','▤'],['IRT','燙床設備','press','▤'],
 ['襯衫機','整燙設備','shirt','▣'],['平燙機','整燙設備','flat','▤'],['ICC','整燙設備','icc','▰'],['天車','周邊設備','crane','⚙']
];
const instances=[
 ['30K','洗衣設備','washer',-52,0,-22],['60K','洗衣設備','washer',-52,0,-5],['80K','洗衣設備','washer',-52,0,12],
 ['襯衫機','整燙設備','shirt',-20,0,-20],['平燙機','整燙設備','flat',-20,0,-2],['ICC','整燙設備','icc',-38,0,25],
 ['N5','燙床設備','press',20,0,-10],['IRT','燙床設備','press',20,0,10],
 ['35kg','洗衣設備','washer',46,0,-25],['50kg','洗衣設備','washer',60,0,-25],
 ['直式洗衣機 #01','洗衣設備','vertical',64,0,0],['直式洗衣機 #02','洗衣設備','vertical',64,0,12],['直式洗衣機 #03','洗衣設備','vertical',64,0,24],
 ['烘乾機 #01','烘乾設備','dryer',20,0,28],['烘乾機 #02','烘乾設備','dryer',34,0,28],['烘乾機 #03','烘乾設備','dryer',48,0,28],
 ['天車 #01','周邊設備','crane',-12,10,-8],['天車 #02','周邊設備','crane',28,10,4]
];
const groups=new Map();let selected=null;let edit=true;let uid=0;

function mat(c,rough=.55,metal=.35){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal});}
function box(w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.castShadow=true;m.receiveShadow=true;return m;}
function label(text,color='#8bd8ff'){const el=document.createElement('div');el.textContent=text;el.style.cssText=`padding:5px 9px;border:1px solid ${color};border-radius:9px;background:rgba(4,20,36,.88);color:#fff;font-weight:800;font-size:12px;white-space:nowrap;box-shadow:0 0 14px ${color}66`;return new CSS2DObject(el);}
function model(type){
 const g=new THREE.Group(); let body,accent;
 if(type==='washer'||type==='vertical'){body=box(type==='vertical'?4:6,5,type==='vertical'?4:6,0xcbd6df);g.add(body);const ring=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.25,.35,32),mat(0x12263b,.25,.6));ring.rotation.x=Math.PI/2;ring.position.set(0,.1,type==='vertical'?2.05:3.05);g.add(ring);accent=box(type==='vertical'?3.4:5,.35,type==='vertical'?3.4:5,0x187fd0);accent.position.y=2.65;g.add(accent);
 } else if(type==='dryer'){body=box(6,5,5,0xd7dee5);g.add(body);const drum=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,.3,32),mat(0x101d2d,.2,.6));drum.rotation.x=Math.PI/2;drum.position.z=2.55;g.add(drum);
 } else if(type==='press'||type==='flat'){g.add(box(4,2.2,12,0xd7e0e7));g.add(box(3,4,3,0x236ea6)).position.y=2.5;g.children[1].position.z=-3.5;g.add(box(3,4,3,0x236ea6));g.children[2].position.y=2.5;g.children[2].position.z=3.5;
 } else if(type==='shirt'){g.add(box(5,5,8,0xb8c7d4));g.add(box(2,7,2,0x246eaa)).position.y=5;
 } else if(type==='icc'){g.add(box(16,4,5,0xc8d5df));g.add(box(13,2.5,1.5,0x2d76aa)).position.y=3;
 } else if(type==='crane'){const beam=box(3,1,22,0x7b8794);beam.position.y=0;g.add(beam);const post1=box(1,8,1,0x4e5a68);post1.position.set(0,4,-9);g.add(post1);const post2=post1.clone();post2.position.z=9;g.add(post2);
 } else {g.add(box(5,4,5,0x93a6b5));}
 return g;
}
function addEquipment(name,type,kind,x,z,save=true){
 const root=new THREE.Group();root.userData={name,type,kind,id:`EQ-${++uid}`};
 const m=model(kind);root.add(m);m.position.y=1.5;
 const plate=box(kind==='icc'?18:8,.18,kind==='icc'?7:8, type==='洗衣設備'?0x0877d1:type==='烘乾設備'?0x1bd58d:type==='燙床設備'?0x9b63ff:0x2a79b9);plate.position.y=.05;root.add(plate);
 const l=label(name,type==='燙床設備'?'#a76cff':type==='烘乾設備'?'#46e0a6':'#35b8ff');l.position.set(0,7,0);root.add(l);
 root.position.set(x,0,z);scene.add(root);groups.set(root.userData.id,root);
 root.traverse(o=>{if(o.isMesh){o.userData.root=root;o.userData.interactive=true;}});
 return root;
}
instances.forEach(v=>addEquipment(...v));
addEquipment('冷風區','周邊設備','crane',-2,42); // visual fan replacement below
const fan=groups.get([...groups.keys()].pop());fan.userData.name='冷風區';fan.children[0].visible=false;fan.children[1].visible=false;
const blades=new THREE.Group();for(let i=0;i<5;i++){const b=box(.35,0.4,5,0xcfd8df);b.position.z=2; b.rotation.y=i*Math.PI*2/5;blades.add(b)}blades.position.y=3;fan.add(blades);const hub=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,.8,32),mat(0x6b7785));hub.rotation.x=Math.PI/2;hub.position.y=3;fan.add(hub);
fan.children.find(x=>x instanceof CSS2DObject)?.element && (fan.children.find(x=>x instanceof CSS2DObject).element.style.color='#ff9ac8');

function addPalette(){
 const wrap=document.getElementById('items');wrap.innerHTML='';
 palette.forEach(([n,t,k,ic])=>{const b=document.createElement('button');b.className='item';b.dataset.kind=k;b.dataset.type=t;b.innerHTML=`<div class="thumb">${ic}</div><span>${n}</span>`;b.onclick=()=>{const r=addEquipment(n,t,k,0,0,false);r.position.copy(controls.target);r.position.y=0;select(r);toast('已加入地圖，拖曳到想要的位置');};wrap.appendChild(b)});
}
addPalette();

const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let drag=null;
function pointer(e){const r=renderer.domElement.getBoundingClientRect();ptr.x=((e.clientX-r.left)/r.width)*2-1;ptr.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(ptr,camera);}
function select(root){selected=root;document.querySelectorAll('.device').forEach(x=>x?.classList?.remove('selected'));openPanel(root);}
function openPanel(r){document.getElementById('pn').textContent=r.userData.name;document.getElementById('pt').textContent=r.userData.type;document.getElementById('panel').classList.add('open');}
renderer.domElement.addEventListener('pointerdown',e=>{
 if(!edit)return;pointer(e);const hits=ray.intersectObjects(scene.children,true).filter(h=>h.object.userData?.interactive);
 if(hits.length){let r=hits[0].object.userData.root;select(r);drag={root:r,startX:e.clientX,startY:e.clientY,moved:false};controls.enabled=false;}
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!drag)return;const dx=(e.clientX-drag.startX)/4,dz=(e.clientY-drag.startY)/4;if(Math.abs(dx)+Math.abs(dz)>4)drag.moved=true;drag.root.position.x+=dx*.035;drag.root.position.z+=dz*.035;drag.startX=e.clientX;drag.startY=e.clientY;
});
renderer.domElement.addEventListener('pointerup',()=>{if(drag){controls.enabled=true;localStorage.setItem('factory3dPositions',JSON.stringify([...groups.values()].map(r=>({id:r.userData.id,name:r.userData.name,type:r.userData.type,kind:r.userData.kind,x:r.position.x,z:r.position.z}))));drag=null;}});
document.getElementById('close').onclick=()=>document.getElementById('panel').classList.remove('open');
document.getElementById('editBtn').onclick=()=>{edit=true;document.getElementById('editBtn').classList.add('active');document.getElementById('viewBtn').classList.remove('active');document.getElementById('hint').textContent='編輯模式：點設備後可拖曳；雙指旋轉／縮放地圖'};
document.getElementById('viewBtn').onclick=()=>{edit=false;document.getElementById('viewBtn').classList.add('active');document.getElementById('editBtn').classList.remove('active');document.getElementById('hint').textContent='巡檢模式：點設備查看清潔、保養、維修資料'};
document.getElementById('resetBtn').onclick=()=>{camera.position.set(0,70,105);controls.target.set(0,0,0);controls.update()};
document.getElementById('search').oninput=e=>{const q=e.target.value.trim().toLowerCase();groups.forEach(r=>r.visible=!q||r.userData.name.toLowerCase().includes(q));};
document.getElementById('filter').onchange=e=>{const f=e.target.value;groups.forEach(r=>r.visible=f==='全部設備'||r.userData.type===f);};
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);labels.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);labels.render(scene,camera)}animate();
</script></div>
</body></html>
