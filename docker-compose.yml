services:
  db:
    image: postgres:16-alpine
    container_name: equipment-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: equipment_manager
      POSTGRES_USER: equipment
      POSTGRES_PASSWORD: CHANGE_THIS_PASSWORD
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

  api:
    build: ./server
    container_name: equipment-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://equipment:CHANGE_THIS_PASSWORD@db:5432/equipment_manager
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:equipment@baiqi.local}
    ports:
      - "3000:3000"
