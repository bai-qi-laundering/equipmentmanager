name: Connect routine checklist
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  connect-checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject checklist script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          tag='<script src="./routine-checklist.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding="utf-8")
          PY
      - name: Commit checklist connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Connect routine checklist UI"
          git push
