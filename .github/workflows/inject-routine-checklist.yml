name: Inject routine checklist UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          tag='<script src="./routine-checklist-ui.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s,encoding="utf-8")
          PY
      - name: Commit injection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add routine checklist UI entry"
          git push
